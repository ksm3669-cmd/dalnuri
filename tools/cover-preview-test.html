<title>표지 미리보기 — 퍼즐 포인트</title>
<style>
html,body{margin:0;padding:0}
body{background:#eef2ed;font-family:"Lecture Korean",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{padding:18px}
.stage{position:relative;width:1280px;height:720px;margin:0 auto;border-radius:24px;overflow:hidden;
  box-shadow:0 2px 0 rgba(20,33,61,.04),0 18px 50px rgba(20,33,61,.14);background:#fff}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;z-index:3;border-radius:24px 24px 0 0;
  background:linear-gradient(90deg,#f2a33a 0 16.6%,#e8603c 16.6% 33.3%,#12a37f 33.3% 50%,#7b61d1 50% 66.6%,#2f7ae5 66.6% 83.3%,#8bb03a 83.3%)}
#slide-1.cover-puzzle{min-height:720px}
body.embed .wrap{padding:8px}
body.embed{overflow:hidden}
@media screen and (max-width:900px){
  .wrap{padding:12px}
  .stage{width:100%;height:auto;border-radius:18px}
  #slide-1.cover-puzzle{min-height:0}
}
body.embed .stage{width:100%}
</style>

#slide-1.cover-puzzle{
  --pz-ink:#16233c;
  --pz-muted:#55607a;
  --pz-amber:#f0a93f;--pz-coral:#ea7c5d;--pz-emerald:#4fb094;
  --pz-lavender:#9787d6;--pz-sky:#79a8e5;--pz-lime:#a3bd60;
  position:relative;
  display:flex;flex-direction:column;
  container-type:inline-size;
  width:100%;height:100%;min-height:0;
  aspect-ratio:16/9;
  padding:4.6cqw 6.4cqw 3.9cqw!important;
  margin:0;
  border:0;border-radius:0;
  overflow:hidden;isolation:isolate;
  color:var(--pz-ink);
  font-family:"Lecture Korean",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:
    radial-gradient(58% 62% at 92% 2%,rgba(240,169,63,.20),transparent 72%),
    radial-gradient(46% 52% at 0% 100%,rgba(151,135,214,.16),transparent 72%),
    radial-gradient(42% 44% at 100% 94%,rgba(79,176,148,.14),transparent 72%),
    linear-gradient(157deg,#fffdf6 0%,#fdf8ec 48%,#f8f1e1 100%)!important;
  box-sizing:border-box;
}
#slide-1.cover-puzzle[hidden]{display:none!important}
#slide-1.cover-puzzle::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");background-size:180px 180px;
  opacity:.34;mix-blend-mode:multiply;
}
/* 퍼즐 조각 그래픽 */
#slide-1.cover-puzzle .pz-art{position:absolute;z-index:0;pointer-events:none;line-height:0}
#slide-1.cover-puzzle .pz-art-tr{right:-4.4cqw;top:-3.1cqw;width:30cqw}
#slide-1.cover-puzzle .pz-art-mid{left:-2.1cqw;top:20.5cqw;width:18.6cqw}
#slide-1.cover-puzzle .pz-svg{display:block;width:100%;height:auto;overflow:visible}
/* 머리글 */
#slide-1.cover-puzzle .pz-head{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:.8em;flex-wrap:wrap;
}
#slide-1.cover-puzzle .pz-mark{
  display:inline-flex;align-items:center;gap:.52em;
  font-size:clamp(11px,1.52cqw,20px);
  font-weight:700;color:#3f4b68;letter-spacing:-.01em;
}
#slide-1.cover-puzzle .pz-mark b{
  font-family:'PUZZLE Display',Pretendard,"Noto Sans KR",sans-serif;
  font-weight:900;letter-spacing:.02em;color:#16233c;
}
#slide-1.cover-puzzle .pz-mark-ico{
  width:1.98em;height:1.98em;flex:none;
  fill:none;stroke:#e08a2b;stroke-width:1.9;stroke-linejoin:round;
  background:#fff6e4;border-radius:.42em;padding:.22em;box-sizing:border-box;
  box-shadow:0 1px 0 #e7cfae inset,0 2px 6px rgba(150,110,45,.12);
}
/* 가운데 */
#slide-1.cover-puzzle .pz-center{
  position:relative;z-index:2;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:1.1cqw 0 .4cqw;
}
#slide-1.cover-puzzle .pz-kicker{
  display:inline-flex;align-items:center;gap:.55em;
  margin:0 0 2.05cqw;padding:.52em 1.15em;
  border-radius:999px;
  background:rgba(255,255,252,.9);
  border:1px solid rgba(226,197,150,.7);
  box-shadow:0 6px 18px rgba(140,105,45,.09),0 1px 0 #fff inset;
