<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사회정서 앱 뷰포트 확인</title>
<style>
  html,body{margin:0;padding:0;background:#dcd6c8;height:100%;overflow:hidden}
  iframe{border:0;display:block;margin:0 auto;background:#FBF8F1}
</style>
</head>
<body>
<iframe id="f" title="확인용 뷰포트"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w'), 10) || 1366;
  var h = parseInt(p.get('h'), 10) || 768;
  var extra = p.get('exact') === '1' ? 15 : 0;   /* 데스크톱 크롬 스크롤바 폭 보정 */
  var f = document.getElementById('f');
  f.style.width = (w + extra) + 'px';
  f.style.height = h + 'px';
  f.src = 'https://ksm3669-cmd.github.io/dalnuri/tools/dalnuri-sel-2027.html?v=' + Date.now();
  f.addEventListener('load', function () {
    var y = parseInt(p.get('scroll'), 10) || 0;
    try { f.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body>
</html>
