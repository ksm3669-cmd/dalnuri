<body>
<div class="shell"><header class="header">
<div class="logo" id="goHome" role="button" tabindex="0" aria-label="홈으로"><div class="mark">✦</div><div class="brand"><b>리노리와 Hello! 달누리</b><small>하루 10분 · 듣고 놀고 말하는 영어</small></div></div>
<div class="top-actions"><button class="btn white" id="routinesTop">🏠 일상 영어</button><button class="iconbtn" id="homeTop" title="홈으로">⌂</button><button class="iconbtn" id="settingsTop" title="교사용 설정">⚙️</button></div></header>
<main><section class="screen active" id="homeScreen"></section><section class="screen" id="courseScreen"></section><section class="screen" id="routineScreen"></section></main></div>
<div class="settings-mask" id="settingsMask" role="dialog" aria-modal="true" aria-label="교사용 설정"><div class="settings"><h2>⚙️ 교사용 설정</h2>
<div class="field"><label for="sTheme">주제</label><select id="sTheme"></select></div>
<div class="field"><label for="sDay">요일</label><select id="sDay"><option value="0">월요일</option><option value="1">화요일</option><option value="2">수요일</option><option value="3">목요일</option><option value="4">금요일</option></select></div>
<div class="field"><label for="sMode">음성 읽기 방식</label><select id="sMode"><option value="mix">한국어로 상황 이해 → 영어 대화</option><option value="en">영어 중심으로 듣기</option><option value="ko">한국어 설명 중심</option></select></div>
<div class="field"><label for="sRate">영어 읽기 속도</label><select id="sRate"><option value="0.75">천천히 (0.75배)</option><option value="0.88">기본 (0.88배)</option><option value="1">자연스럽게 (1배)</option></select></div>
<label class="checks"><input type="checkbox" id="sAuto"/>페이지를 열면 자동으로 읽어주기</label>
<label class="checks"><input type="checkbox" id="sKo"/>마지막 영어 그림책에 우리말 뜻 기본 표시</label>
<div class="field"><label for="sMascot">영어 친구 이름</label><input id="sMascot" type="text" maxlength="12" value="리노리"/></div>
<p class="hint">이 앱은 네트워크 없이 실행할 수 있으며, 음성은 기기의 브라우저 음성을 사용합니다. 일상 영어·완료 기록은 이 기기에만 저장됩니다. 다른 컴퓨터와 실시간 동기화되지는 않습니다.</p>
<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px"><button class="btn white" id="cancelSettings">취소</button><button class="btn primary" id="saveSettings">저장하기</button></div>

Mix, mix! Can you help me?","b":"Yes, I can! Let’s mix together!"},{"art":"sun","ko":"수프가 보글보글 끓자 향긋한 냄새가 퍼졌어요. 모두가 기대하며 기다렸지요.","a":"It smells so good!","b":"Is it ready? Not yet! Let’s wait!"},{"art":"restaurant","ko":"이제 차례대로 그릇에 담았어요. 친구들은 조심스럽게 음식을 건네받았답니다.","a":"Here you go! Be careful, it is hot.","b":"Thank you! I will wait."},{"art":"heart","ko":"마지막 한 숟가락까지 맛있게 먹었어요. 누구의 도움도 빠뜨릴 수 없다는 걸 알았지요.","a":"We did it! Great teamwork!","b":"Yummy! We made it together!"}]},{"enTitle":"Rice Goes Around the World","open":"One tiny grain of rice has a very big dream. It wants to see the world.","close":"The little grain smiles. Rice can look different, but sharing food brings us together!","focus":["I see rice!","I like noodles.","Let’s share!"],"role":["Do you like rice?","Yes, I do! I like rice!"],"life":["식사 시간 밥과 음식을 가리키며","I like rice!"],"quiz":["Which bowl has rice?",["🍚","🧁","🥕"],0],"beats":[{"art":"rice","ko":"작은 쌀알은 논에 살았어요. 어느 날 세계 여러 나라의 식탁을 여행하고 싶어졌지요.","a":"Hello! I am little Rice.","b":"Where are you going? Let’s go!"},{"art":"rice","ko":"첫 번째 집에서는 따뜻한 밥으로 변했어요. 아이들이 맛있게 한 숟가락씩 먹었지요.","a":"Look! I see rice in a bowl.","b":"I like rice! It is warm and soft."},{"art":"noodles","ko":"다음 나라에서는 쌀이 기다란 쌀국수로 변했어요. 쌀알은 깜짝 놀랐답니다.","a":"Wow! Long noodles!","b":"I like noodles! Slurp, slurp!"},{"art":"taco","ko":"또 다른 식탁에는 얇은 쌀종이와 신선한 채소가 놓였어요.","a":"What is this? It is rice paper!","b":"Let’s put vegetables inside!"},{"art":"rice","ko":"쌀알은 모습이 바뀌어도 자신이 쌀이라는 사실이 신기했어요.","a":"Rice, noodles, rice paper!","b":"So many foods! They are different."},{"art":"heart","ko":"가족이 한 식탁에 모여 음식을 나누자 쌀알은 여행에서 가장 소중한 것을 배웠어요.","a":"Let’s share our food!","b":"Thank you! I love eating together!"}]},{"enTitle":"Welcome to Dalnuri Café!","open":"Today the children open a café. Rinori is the first customer!","close":"The café is closed. Everyone smiles and says, “See you tomorrow!”","focus":["What would you like?","Here you go!","Thank you!"],"role":["What would you like?","Rice, please! Thank you!"],"life":["역할놀이 코너에서 손님과 점원이 되어","Welcome! What would you like?"],"quiz":["Who is the customer?",["🧑‍🍳","🧍","🍳"],1],"beats":[{"art":"restaurant","ko":"달누리반 친구들이 식당 간판을 걸었어요. 오늘은 모두 역할을 바꾸어 가며 놀이하기로 했답니다.","a":"Welcome to Dalnuri Café!","b":"Hello! May I come in?"},{"art":"pizza","ko":"요리사와 손님이 서로 인사했어요. 메뉴판에는 다양한 음식이 있었습니다.","a":"What would you like today?","b":"Hmm… Can I have pizza, please?"},{"art":"taco","ko":"이번에는 다른 친구가 타코를 주문했어요. 점원은 잘 듣고 주문을 다시 말해 보았어요.","a":"One taco? Is that right?","b":"Yes, please! One taco!"},{"art":"mix","ko":"음식을 만드는 친구들은 차례를 정해 협력했어요. 기다리는 손님도 응원했지요.","a":"Let’s make it together!","b":"I can help! You can help, too!"},{"art":"restaurant","ko":"음식이 완성되자 점원이 정성스럽게 두 손으로 건넸습니다.","a":"Here you go! Enjoy your food!","b":"Thank you very much!"},{"art":"heart","ko":"가게 문을 닫을 때 친구들은 서로의 친절했던 말을 떠올렸어요.","a":"Thank you for coming!","b":"See you tomorrow! Goodbye!"}]},{"enTitle":"Leo Says Hello","open":"Leo the lion wants to make a friend, but his voice is very quiet.","close":"Leo finds his brave voice. His friends clap for him. Hello, new friend!","focus":["Hello!","What is your name?","My name is Leo."],"role":["What is your name?","My name is Leo!"],"life":["등원하고 처음 만나는 친구에게","Hello! What is your name?"],"quiz":["Find the lion!",["🐰","🦁","🐻"],1],"beats":[{"art":"lion","ko":"사자 레오는 숲속 친구들과 놀고 싶었지만 먼저 말을 건네기가 쑥스러웠어요.","a":"I want to say hello.","b":"You can do it, Leo! I am here."},{"art":"rabbit","ko":"토끼가 다가와 부드럽게 인사했어요. 레오는 조용히 손을 흔들었지요.","a":"Hello, Leo!","b":"Hello, Rabbit. Nice to see you!"},{"art":"bear","ko":"곰이 이름을 묻자 레오는 한 번 더 용기를 내 보았어요.","a":"What is your name?","b":"My name is Leo. What is your name?"},{"art":"lion","ko":"친구들은 레오의 대답을 기다렸어요. 재촉하지 않고 다정하게 웃었답니다.","a":"Take your time. We can wait.","b":"Thank you. I can say it!"},{"art":"heart","ko":"레오는 가슴이 두근거렸지만 크게 인사했어요. 친구들이 박수를 쳤지요.","a":"Hello, everyone! I am Leo!","b":"Hi, Leo! Come and play!"},{"art":"sun","ko":"작은 인사 한마디가 멋진 놀이의 시작이 되었어요.","a":"Let’s play tog he little flower?","b":"I can help! Look down here!"},{"art":"heart","ko":"생쥐는 작은 틈 사이에서 꽃을 찾아 엘리에게 선물했어요.","a":"Here you go, Ellie!","b":"Thank you! We help each other!"},{"art":"sun","ko":"둘은 서로 다르다는 것을 장점으로 생각하게 되었어요.","a":"Big or small, we can help!","b":"Yes! We are a team!"}]},{"enTitle":"Bobo Finds a Friend","open":"Bobo the bear has moved to a new forest. He feels shy.","close":"Now the forest feels like home. One little hello makes a big difference.","focus":["Can I play?","Yes, come in!","Let’s play together!"],"role":["Can I play with you?","Yes! Come and play!"],"life":["새 친구의 놀이에 참여하고 싶을 때","Can I play with you?"],"quiz":["Find the bear!",["🦊","🐻","🐥"],1],"beats":[{"art":"bear","ko":"곰 보보는 새로운 숲으로 이사 왔어요. 낯선 놀이터를 멀리서 바라보았지요.","a":"This forest is new to me.","b":"It is okay, Bobo. Say hello!"},{"art":"rabbit","ko":"친구들이 공놀이를 하고 있었어요. 보보도 함께하고 싶었지만 망설였어요.","a":"They are playing with a ball.","b":"Can I play with you?"},{"art":"lion","ko":"사자 친구는 보보를 향해 활짝 웃었어요.","a":"Yes! Come and play with us!","b":"Thank you! I can kick the ball."},{"art":"sun","ko":"공이 멀리 굴러가자 보보가 달려가서 가져왔어요.","a":"Here is the ball!","b":"Great! Thank you, Bobo!"},{"art":"heart","ko":"놀이가 끝나자 친구들은 보보의 이름을 기억했어요.","a":"You are our friend now!","b":"I am happy! Thank you, friends!"},{"art":"flower","ko":"다음 날 보보는 먼저 친구들에게 다가가 인사했어요.","a":"Hello! Can I play again?","b":"Yes! Let’s play together!"}]},{"enTitle":"The Forest Music Band","open":"The forest friends are getting ready for a big concert.","close":"Different sounds make one beautiful song. Everybody belongs in the band!","focus":["Listen to me!","My turn!","Your turn!"],"role":["My turn, please!","Okay! It’s your turn!"],"life":["노래, 악기, 순서 기다리기 놀이에서","My turn! Your turn!"],"quiz":["Who can sing?",["🎵","🍕","🧦"],0],"beats":[{"art":"music","ko":"숲속에서는 처음으로 음악회를 열기로 했어요. 친구들은 자신의 소리를 들려주고 싶었지요.","a":"Let’s make music!","b":"Yes! Let’s sing together!"},{"art":"lion","ko":"사자는 낮고 멋진 목소리로 노래했어요.","a":"Listen to me! Roar, roar!","b":"Wow r hands clean?","손이 깨끗해졌니?"],["나","Yes! All clean!","응! 깨끗해졌어!"]],"real":"손 씻으러 가면서 “Wash your hands!” 말해요."},{"id":"snack","emoji":"🍎","title":"간식 · 식사","en":"Snack Time","lines":[["리노리","It is snack time. Are you hungry?","간식 시간이야. 배고프니?"],["나","Yes, I am! Can I have some, please?","응! 조금 주실래요?"],["리노리","Here you go!","여기 있어!"],["나","Thank you! It is yummy!","고마워! 맛있어!"]],"real":"간식을 받을 때 “Can I have some, please?” 말해요."},{"id":"clean","emoji":"🧸","title":"놀잇감 정리","en":"Clean Up Time","lines":[["리노리","Clean up time! Let’s put the toys away.","정리할 시간이야. 장난감을 제자리에 두자."],["나","I can help!","나도 도울 수 있어!"],["리노리","Let’s do it together!","함께 하자!"],["나","All done! We did it!","다 끝났어! 우리가 해냈어!"]],"real":"정리를 시작하며 “I can help!” 말해요."},{"id":"friends","emoji":"🤝","title":"친구와 놀이","en":"Playing Together","lines":[["리노리","Do you want to play?","함께 놀고 싶니?"],["나","Can I play with you?","나도 함께 놀아도 될까?"],["리노리","Yes! Come and play!","그럼! 같이 놀자!"],["나","Thank you! My turn, please.","고마워! 이제 내 차례야."]],"real":"친구 놀이에 참여할 때 “Can I play with you?” 말해요."},{"id":"help","emoji":"💬","title":"도움 · 마음 표현","en":"Ask for Help","lines":[["리노리","How do you feel?","지금 마음이 어때?"],["나","I feel sad. I need help, please.","슬퍼. 도와줘."],["리노리","I am here. Let’s try together.","내가 옆에 있어. 함께 해 보자."],["나","Thank you. I feel better.","고마워. 마음이 나아졌어."]],"real":"어려울 때 “I need help, please.” 말해요."},{"id":"outdoor","emoji":"🌳","title":"바깥놀이","en":"Let’s Go Outside","lines":[["리노리","Let’s go outside!","바깥으로 나가자!"],["나","Hooray! Let’s go!","신난다! 출발!"],["리노리","Wait for me, please.","날 기다려 줘."],["나","Okay! Let’s go together!","좋아! 함께 가자!"]],"real":"줄 맞추어 이동할 때 “Let’s go!” 말해요."},{"id":"bye","emoji":"👋","title":"하원 · 작별","en":"See You Tomorrow","lines":[["리노리","Did you have fun today?","오늘 재미있었니?"],["나","Yes, I did!","응, 재미있었어!"],["리노리","Goodbye! See you tomorrow!","안녕! 내일 또 만나!"],["나","See you tomorrow, Rinori!","리노리, 내일 또 만나!"]],"real":"하원할 때 “See you tomorrow!” 인사해요."}]};
const $=id=>document.getElementById(id);
const DAYS=['월','화','수','목','금'];
const PHS=[['story','📖','이야기 속으로'],['quiz','👀','듣고 찾아요'],['talk','💬','영어로 말해요'],['life','🏠','오늘 바로 써요'],['book','📚','영어 그림책']];
const BASE={theme:'food',day:0,mode:'mix',rate:.88,auto:false,showKo:false,mascot:'리노리',completed:{}};
let state={...BASE},screen='home',phase='story',page=0,quizChoice=-1,spoken=false,bookKo=false,timerId=null,seconds=600,paused=false,runId=0,routineIndex=0,routineLine=0,speechActive=false;
try{const v=JSON.parse(localStorage.getItem('rinori-dalnuri-v3')||'null');if(v&&typeof v==='object')state={...BASE,...v,completed:v.completed||{}}}catch(e){}
function save(){try{localStorage.setItem('rinori-dalnuri-v3',JSON.stringify(state))}catch(e){}}
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th=()=>DATA.themes.find(t=>t.id===state.theme)||DATA.themes[0];
const episode=()=>DATA.episodes[DATA.themes.findIndex(t=>t.id===th().id)*5+state.day];
const isDone=()=>Boolean(state.completed[`${state.theme}-${state.day}`]);
function show(which){screen=which;['home','course','routine'].forEach(i=>$(i+'Screen').classList.toggle('active',i===which));window.scrollTo({top:0,behavior:'instant'});}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function speechStop(){runId++;if('speechSynthesis'in window){try{speechSynthesis.cancel()}catch(e){}}speechActive=false;}
function voiceFor(lang){let voices=window.speechSynthesis?.getVoices()||[];let ls=voices.filter(v=>v.lang.toLowerCase().startsWith(lang));return ls.find(v=>v.lang.toLowerCase()===(lang==='en'?'en-us':'ko-kr'))||ls.find(v=>v.localService)||ls[0]||null;}
function speak(items){speechStop();if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 읽기를 지원하지 않아요.');return;}let seq=items.filter(x=>x&&x.text&&x.text.trim());if(!seq.length)return;let token=runId;speechActive=true;let idx=0;const next=()=>{if(token!==runId)return;if(idx>=seq.length){speechActive=false;return;}let item=seq[idx++];let u=new SpeechSynthesisUtterance(item.text);u.lang=item.lang==='ko'?'ko-KR':'en-US';u.rate=item.lang==='ko'?Math.min(1,Number(state.rate)+.1):Number(state.rate);u.pitch=item.lang==='ko'?1.05:1.1;let v=voiceFor(item.lang);if(v)u.voice=v;u.onend=next;u.onerror=()=>{speechActive=false;};try{speechSynthesis.speak(u)}catch(e){speechActive=false;toast('음성 재생을 시작하지 못했어요.')}};next();}
function en(text){speak([{lang:'en',text}])}function ko(text){speak([{lang:'ko',text}])}
function sceneSpeak(){let e=episode();if(phase==='story'){let b=e.beats[page];if(state.mode==='en')speak([{lang:'en',text:b.a},{lang:'en',text:b.b}]);else if(state.mode==='ko')ko(b.ko);else speak([{lang:'ko',text:b.ko},{lang:'en',text:b.a},{lang:'en',text:b.b}])}else if(phase==='book'){let b=bookPages()[page];if(state.mode==='ko')ko(b.ko);else if(state.mode==='mix')speak([{lang:'en',text:b.en},{lang:'ko',text:b.ko}]);else en(b.en);}else if(phase==='quiz')en(e.quiz[0]);else if(phase==='talk')speak([{lang:'en',text:e.role[0]},{lang:'en',text:e.role[1]}]);else if(phase==='life')speak([{lang:'ko',text:e.life[0]},{lang:'en',text:e.life[1]}]);}
function autoSpeak(){if(state.auto)setTimeout(()=>{if(screen==='course'&&!speechActive)sceneSpeak()},210)}

></g>`;return `<svg viewBox="0 0 820 460" role="img" aria-label="${esc(th().name||'이야기')} 삽화" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${gid}-sky" x2="0" y2="1"><stop stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient><filter id="${gid}-shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#394c7a" flood-opacity=".17"/></filter></defs><rect width="820" height="460" fill="url(#${gid}-sky)"/>${stars}<circle cx="720" cy="76" r="39" fill="#fff9cf" opacity=".75"/>${set}<g transform="translate(${365+(seed%3)*5} 266) scale(.83)" filter="url(#${gid}-shadow)">${objectArt(at)}</g>${mascot(602,213,.92)}<g fill="#fff" opacity=".65"><ellipse cx="345" cy="404" rx="160" ry="11"/><circle cx="198" cy="70" r="6"/><circle cx="242" cy="112" r="8"/></g></svg>`}

function renderHome(){let t=th(),e=episode();$('homeScreen').innerHTML=`<section class="hero"><div class="hero-content"><span class="pill dark">✦ RINORI ENGLISH STORY CLUB</span><h1>영어를 배우는 시간보다<br>영어로 <span style="color:#ffe6a6">노는 하루!</span></h1><p>${esc(state.mascot)}가 우리말로 이야기를 들려주고,<br>영어로 말을 걸어요. 듣고, 말하고, 직접 놀이해요.</p><button class="btn" data-go="start">오늘의 10분 이야기 시작 ▶</button></div><div class="hero-art">${heroArt()}</div></section>
<div class="feature-row"><div class="feature"><strong>① 영어+우리말 이야기</strong><span>6장, 매 장면 두 번의 영어 대화</span></div><div class="feature"><strong>② 듣고 찾아보기</strong><span>이야기에 나온 말을 들으며 터치</span></div><div class="feature"><strong>③ 실제로 말해 보기</strong><span>친구·교사와 주고받는 말</span></div><div class="feature"><strong>④ 영어 그림책 마무리</strong><span>마지막 8쪽 읽어주기 그림책</span></div></div>

function start(){speechStop();seconds=600;paused=false;phase='story';page=0;quizChoice=-1;spoken=false;bookKo=Boolean(state.showKo);show('course');renderCourse();startTimer();autoSpeak()}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(screen!=='course'||paused||phase==='done')return;seconds=Math.max(0,seconds-1);let el=$('countdown');if(el)el.textContent=fmt(seconds);if(!seconds){paused=true;toast('10분이 지났어요. 그림책을 계속 읽어도 좋아요!')}},1000)}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

function footer(nextText='다음으로 →'){return `<div class="lesson-footer"><span class="footer-info">🎈 천천히 해도 괜찮아요. 영어를 말해 본 것만으로도 충분해요.</span><div class="footer-buttons"><button class="btn white" data-prev="1">← 이전</button><button class="btn primary" data-next="1">${nextText}</button></div></div>`}
function renderCourse(){let t=th(),e=episode(),body='';if(phase==='story'){let b=e.beats[page];body=`<div class="story-grid"><div><div class="art-frame">${art(t.id,b.art,page)}<div class="page-stamp">STORY ${page+1} / 6</div></div><div class="listen-btns"><button class="btn navy" data-speak="scene">${state.mode==='en'?'🇺🇸 영어 듣기':state.mode==='ko'?'🇰🇷 우리말 듣기':'🔊 한국어 + 영어 듣기'}</button><button class="btn white" data-speak="enstory">🇺🇸 영어만 다시 듣기</button><button class="btn white" data-speak="ko">🇰🇷 우리말 듣기</button></div></div><div class="narrative"><div class="overline">${esc(state.mascot)}와 함께하는 이야기 · ${page+1}번째 장면</div><h2>${esc(t.names[state.day])}</h2><div class="ko-narration">${esc(b.ko)}</div><div class="speechline"><b>🤖 ${esc(state.mascot)} · RINORI</b><em>${esc(b.a)}</em><button data-speak="a" aria-label="리노리의 영어 듣기">🔊</button></div><div class="speechline friend"><b>🧒 FRIEND · 친구</b><em>${esc(b.b)}</em><button data-speak="b" aria-label="친구의 영어 듣기">🔊</button></div><p class="sub">그림 속 상황을 이해한 뒤 영어 대화를 들어 보세요. 듣고 싶은 문장은 여러 번 눌러도 좋아요.</p></div></div>${footer(page===5?'찾기 미션으로 →':'다음 장면 →')}`}
else if(phase==='quiz'){let q=e.quiz;body=`<div class="center"><span class="pill">👂 LISTEN & FIND</span><h2 class="stage-title" style="margin-top:14px">듣고 찾아봐요</h2><p class="stage-desc">${esc(q[0])} · 소리를 듣고 그림을 눌러 보세요.</p><div class="big-quote">“${esc(q[0])}”</div><button class="btn navy" data-speak="scene">🔊 영어 질문 듣기</button><div class="quiz-choice-grid">${q[1].map((op,i)=>`<button class="quiz-choice ${quizChoice===i?'selected':''}" data-choice="${i}" aria-label="선택지 ${i+1}"><span>${op}</span><b>${['ONE','TWO','THREE'][i]}</b></button>`).join('')}</div>${quizChoice>=0?`<div class="feedback ${quizChoice===q[2]?'':'retry'}">${quizChoice===q[2]?'⭐ Great job! 잘 찾았어요!':'다시 들어 볼까요? You can try again!'}</div>`:''}</div>${footer('말하기 놀이로 →')}`}
else if(phase==='talk'){let [a,b]=e.role;body=`<div class="talk-layout"><div class="center"><span class="pill">💬 LET’S TALK!</span><h2 class="stage-title" style="margin-top:15px">이제 내가 말해 볼게요!</h2><p class="stage-desc">리노리가 먼저 말해요. 친구 역할이 되어 대답하고, 실제로 주고받아 보세요.</p></div><div class="talk-card"><div class="avatar">🤖</div><div><small>${esc(state.mascot)} · 먼저 질문해요</small><div class="line">${esc(a)}</div><button class="btn white" data-speak="talkA">🔊 리노리 듣기</button></div></div><div class="talk-card child"><div class="avatar">🧒</div><div><small>내 차례 · 크게 또는 작게 말해요</small><div class="line">${esc(b)}</div><button class="btn white" data-speak="talkB">🔊 대답 듣기</button></div></div><div class="center"><button class="btn navy" data-speak="scene">▶ 대화 전체 들어보기</button> <button class="btn ${spoken?'primary':'white'}" data-spoken="1">${spoken?'⭐ 내가 말했어요!':'🎤 나도 말해 봤어요'}</button><p class="sub">※ 실제 목소리를 인식·채점하지 않습니다. 아이가 말하거나 몸짓으로 참여한 뒤 버튼을 눌러 주세요.</p></div></div>${footer('우리 반에서 써보기 →')}`}
else if(phase==='life'){let [where,phrase]=e.life;body=`<div style="max-width:850px;margin:auto"><div class="center"><span class="pill">🏠 REAL-LIFE ENGLISH</span><h2 class="stage-title" style="margin-top:15px">영어는 교실에서 계속돼요!</h2><p class="stage-desc">이야기에서 들었던 말을 실제 놀이와 일상에 다시 사용해 보세요.</p></div><div class="life-banner"><div class="emoji">🤝</div><div><b>${esc(where)}</b><p>오늘의 일상 영어 한마디</p><div class="big-quote" style="margin:8px 0;color:#23866c">${esc(phrase)}</div></div></div><div class="center" style="margin-top:17px"><button class="btn navy" data-speak="scene">🔊 ${esc(state.mascot)}와 연습하기</button> <button class="btn white" id="openDaily">🏠 일상 영어 8가지 둘러보기</button></div><p class="sub center" style="margin-top:18px">수업이 끝나더라도 이 말은 하루 중 자연스러운 상황에서 계속 사용해 주세요.</p></div>${footer('마지막 영어 그림책 →')}`}
else if(phase==='book'){let b=bookPages()[page];body=`<div class="book-panel"><div class="center"><span class="pill">📚 ORIGINAL ENGLISH PICTURE BOOK</span><div style="margin-top:9px" class="book-tiny">${page+1} / 8 PAGE · ${esc(e.enTitle)}</div></div><div class="book-scene">${art(t.id,b.art,page+2)}<div class="page-stamp">${page===0?'THE STORY BEGINS':page===7?'THE END':'PAGE '+(page+1)}</div></div><div class="book-page"><div class="en">${esc(b.en)}</div>${bookKo?`<div class="ko">${esc(b.ko)}</div>`:''}</div><div class="book-controls"><button class="btn navy" data-speak="book">${state.mode==='mix'?'🔊 영어+우리말 그림책 듣기':state.mode==='en'?'🔊 영어 그림책 읽어주기':'🔊 우리말 그림책 듣기'}</button><button class="btn white" data-speak="enbook">🇺🇸 영어만 듣기</button><button class="btn white" data-ko-toggle="1">${bookKo?'우리말 뜻 숨기기':'우리말 뜻 보기'}</button></div><div class="chapter-tabs">${Array.from({length:8},(_,i)=>`<i class="${i===page?'on':''}"></i>`).join('')}</div></div>${footer(page===7?'이야기 완성하기 ⭐':'다음 그림책 장면 →')}`}
else if(phase==='done'){body=`<div class="done-hero"><div class="star">🌟</div><span class="pill">YOU DID IT!</span><h2>오늘도 영어로 놀았어요!</h2><p>${esc(state.mascot)}와 함께 이야기 듣고, 영어로 말하고,<br>8쪽 그림책까지 읽었어요.</p><blockquote>${esc(e.focus[0])}</blockquote><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn primary" id="backAfterDone">🏠 홈으로</button><button class="btn white" id="bookAgain">📚 그림책 다시 읽기</button><button class="btn navy" id="routinesAfter">💬 일상 영어로 이어가기</button></div></div>`}
$('courseScreen').innerHTML=courseHtml(body);let p=$('pauseTimer');if(p)p.onclick=()=>{paused=!paused;p.textContent=paused?'▶':'Ⅱ';toast(paused?'타이머를 잠시 멈췄어요.':'타이머를 다시 시작했어요.')};$('courseScreen').querySelectorAll('[data-next]').forEach(b=>b.onclick=nextStep);$('courseScreen').querySelectorAll('[data-prev]').forEach(b=>b.onclick=prevStep);$('courseScreen').querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speakAction(b.dataset.speak));$('courseScreen').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{quizChoice=Number(b.dataset.choice);en(episode().quiz[1][quizChoice]+'!');let correct=quizChoice===episode().quiz[2];renderCourse();if(correct)toast('Great job! 잘 찾았어요!')});$('courseScreen').querySelectorAll('[data-spoken]').forEach(b=>b.onclick=()=>{spoken=!spoken;renderCourse();if(spoken)toast('좋아요! 영어로 말해 봤네요!')});$('courseScreen').querySelectorAll('[data-ko-toggle]').forEach(b=>b.onclick=()=>{bookKo=!bookKo;renderCourse()});$('courseScreen').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{speechStop();phase=b.dataset.jump;page=0;renderCourse();autoSpeak()});if($('openDaily'))$('openDaily').onclick=()=>openRoutine(0);if($('backAfterDone'))$('backAfterDone').onclick=home;if($('bookAgain'))$('bookAgain').onclick=()=>{phase='book';page=0;renderCourse();autoSpeak()};if($('routinesAfter'))$('routinesAfter').onclick=()=>openRoutine(0);}
function speakAction(x){let e=episode();if(x==='scene'||x==='book')return sceneSpeak();if(x==='enstory'){let b=e.beats[page];return speak([{lang:'en',text:b.a},{lang:'en',text:b.b}])}if(x==='ko')return ko(e.beats[page].ko);if(x==='a')return en(e.beats[page].a);if(x==='b')return en(e.beats[page].b);if(x==='talkA')return en(e.role[0]);if(x==='talkB')return en(e.role[1]);if(x==='enbook')return en(bookPages()[page].en)}
function nextStep(){speechStop();if(phase==='story'){if(page<5)page++;else{phase='quiz';page=0}}else if(phase==='quiz'){phase='talk';page=0}else if(phase==='talk'){phase='life';page=0}else if(phase==='life'){phase='book';page=0}else if(phase==='book'){if(page<7)page++;else{phase='done';page=0;state.completed[`${state.theme}-${state.day}`]=new Date().toISOString().slice(0,10);save();celebrate()}}renderCourse();window.scrollTo({top:0,behavior:'instant'});autoSpeak()}
function prevStep(){speechStop();if(phase==='story'){if(page>0)page--;else{home();return}}else if(phase==='quiz'){phase='story';page=5}else if(phase==='talk')phase='quiz';else if(phase==='life')phase='talk';else if(phase==='book'){if(page>0)page--;else{phase='life';page=0}}renderCourse();window.scrollTo({top:0,behavior:'instant'});autoSpeak()}
function celebrate(){let c=$('confetti');c.innerHTML=Array.from({length:55},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#f8b95c','#ed849f','#8293e6','#7bcab4'][i%4]};--tx:${Math.random()*280-140}px;animation-delay:${Math.random()*.8}s"></i>`).join('');setTimeout(()=>c.innerHTML='',3400)}
function home(){speechStop();clearInterval(timerId);show('home');renderHome()}
function openRoutine(idx){speechStop();routineIndex=idx;routineLine=0;show('routine');renderRoutine()}
function renderRoutine(){let r=DATA.routines[routineIndex];$('routineScreen').innerHTML=`<div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><span class="tiny-title">DAILY ENGLISH · 하루 여러 번 쓰는 말</span><h1 class="heading" style="margin-top:7px">${r.emoji} ${r.title}</h1><div class="sub">${r.en} · 듣고, 말하고, 실제로 행동해 보아요.</div></div><button class="btn white" id="routineHome">← 홈</button></div><div class="routine-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${DATA.routines.map((a,i)=>`<button class="routine-btn ${i===routineIndex?'selected':''}" style="${i===routineIndex?'border-color:#7b83d5;background:#edeeff;':''}" data-routine="${i}"><span class="em">${a.emoji}</span><b>${a.title}</b></button>`).join('')}</div></div><div class="card"><div class="routinedetail"><div class="routinetile"><div class="em">${r.emoji}</div><h2>${r.en}</h2><p class="sub">말하기 연습 후 실제 교실에서 해 보세요.</p><button class="btn primary" id="routinePlay">🔊 전체 대화 듣기</button><div class="routine-advice">🏫 ${esc(r.real)}</div></div><div class="routine-lines">${r.lines.map((l,i)=>`<button class="routine-line ${routineLine===i?'active':''}" data-line="${i}"><b>${l[0]==='리노리'?'🤖 '+esc(state.mascot):'🧒 내가 말하는 차례'}</b><p>${esc(l[1])}</p><span>${esc(l[2])}　🔊</span></button>`).join('')}<div style="display:flex;gap:9px"><button class="btn white" id="routinePrev">← 이전 말</button><button class="btn navy" id="routineNext">다음 말 →</button></div></div></div></div>`;$('routineHome').onclick=home;$('routinePlay').onclick=()=>{let items=[];r.lines.forEach(l=>{if(state.mode!=='en')items.push({lang:'ko',text:l[2]});if(state.mode!=='ko')items.push({lang:'en',text:l[1]})});speak(items)};$('routinePrev').onclick=()=>{routineLine=Math.max(0,routineLine-1);renderRoutine()};$('routineNext').onclick=()=>{routineLine=(routineLine+1)%4;renderRoutine();speak([{lang:'en',text:r.lines[routineLine][1]}])};$('routineScreen').querySelectorAll('[data-line]').forEach(x=>x.onclick=()=>{routineLine=Number(x.dataset.line);renderRoutine();let l=r.lines[routineLine];if(state.mode==='ko')ko(l[2]);else if(state.mode==='mix')speak([{lang:'ko',text:l[2]},{lang:'en',text:l[1]}]);else en(l[1])});$('routineScreen').querySelectorAll('[data-routine]').forEach(x=>x.onclick=()=>openRoutine(Number(x.dataset.routine)));}
function settings(open){if(open){speechStop();$('sTheme').value=state.theme;$('sDay').value=state.day;$('sMode').value=state.mode;$('sRate').value=String(state.rate);$('sAuto').checked=state.auto;$('sKo').checked=state.showKo;$('sMascot').value=state.mascot;$('settingsMask').classList.add('open')}else $('settingsMask').classList.remove('open')}
function init(){DATA.themes.forEach(t=>$('sTheme').insertAdjacentHTML('beforeend',`<option value="${t.id}">${t.icon} ${t.name}</option>`));let hasSaved=false;try{hasSaved=Boolean(localStorage.getItem('rinori-dalnuri-v3'))}catch(e){}if(!hasSaved){let d=new Date().getDay();if(d>=1&&d<=5)state.day=d-1;}renderHome();$('goHome').onclick=home;$('goHome').onkeydown=e=>{if(e.key==='Enter')home()};$('homeTop').onclick=home;$('routinesTop').onclick=()=>openRoutine(0);$('settingsTop').onclick=()=>settings(true);$('cancelSettings').onclick=()=>settings(false);$('settingsMask').onclick=e=>{if(e.target===$('settingsMask'))settings(false)};$('saveSettings').onclick=()=>{state.theme=$('sTheme').value;state.day=Number($('sDay').value);state.mode=$('sMode').value;state.rate=Number($('sRate').value);state.auto=$('sAuto').checked;state.showKo=$('sKo').checked;state.mascot=$('sMascot').value.trim()||'리노리';save();settings(false);home();toast('선생님 설정을 저장했어요!')};document.addEventListener('click',e=>{const b=e.target.closest('[data-go], [data-theme], [data-day], [data-routine]');if(!b)return;if(b.dataset.go==='start')start();else if(b.dataset.theme)selectedTheme(b.dataset.theme);else if(b.dataset.day!==undefined)selectedDay(Number(b.dataset.day));else if(b.dataset.routine!==undefined&&screen==='home')openRoutine(Number(b.dataset.routine))});document.addEventListener('visibilitychange',()=>{if(document.hidden){speechStop();paused=true;}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){settings(false);speechStop()}});if('speechSynthesis'in window)try{speechSynthesis.getVoices()}catch(e){} }
init();
</script>
</body></html>
