<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f2">
<title>말하면 써지는 편지 | 달누리반 수채화 편지공방</title>
<meta name="description" content="선생님 도움 없이 내 목소리로 편지를 쓰고, 우표와 왁스 도장을 찍어 진짜 우체통에 부쳐요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Gaegu:wght@400;700&family=Gamja+Flower&family=Jua&family=Noto+Sans+KR:wght@400;600;700;800;900&family=Single+Day&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4c3740;
  --soft: #897479;
  --line: #edd8d7;
  --paper: #fffaf4;
  --acc: #d9748b;
  --tink: #8a4d65;
  --gold: #d4a342;
  --gold-glow: #fbe285;
  --shadow: 0 9px 28px rgba(145,95,104,.13);
  --shadow-lg: 0 17px 44px rgba(143,99,110,.16);
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --cute: 'Gamja Flower', 'Single Day', 'Gaegu', cursive;
  --hand: 'Gamja Flower', 'Gaegu', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; margin: 0; font-family: var(--font); color: var(--ink); }
html { background: #fff9f2; }
body {
  background: linear-gradient(180deg, rgba(255,253,248,.35), rgba(255,248,240,.2)), #fffaf4;
  -webkit-user-select: none; user-select: none; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(circle at 10% 40%, rgba(247,193,194,.18), transparent 35%),
              radial-gradient(circle at 90% 75%, rgba(191,184,232,.15), transparent 35%);
}

button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #b179c2; outline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -.035em; }

.app {
  position: relative; z-index: 1; width: min(100%, 1020px);
  margin: 0 auto; padding: 18px 18px 80px;
}

/* Top Nav */
.top-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.nav-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.92); padding: 8px 16px; border-radius: 999px;
  font-size: 13px; text-decoration: none; font-weight: 700; color: #665258;
  box-shadow: 0 3px 12px rgba(162,108,113,0.12); border: 1px solid #eed6d5;
  backdrop-filter: blur(4px); transition: .2s;
}
.nav-link:hover { transform: translateY(-1px); }
.sound-btn {
  padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.92);
  border: 1px solid #eed6d5; font-size: 13px; font-weight: 800; color: #8a586a;
  box-shadow: 0 3px 12px rgba(162,108,113,0.1);
}

/* Hero Banner */
.letter-hero {
  position: relative; padding: 22px 20px 24px; text-align: center;
  background: radial-gradient(90% 130% at 50% 50%, rgba(255,252,246,.98) 25%, rgba(255,242,231,.92) 65%, rgba(252,226,228,.7)), #fffcf8;
  border: 1.5px solid rgba(223,167,172,.45); border-radius: 28px;
  box-shadow: 0 9px 28px rgba(162,108,113,.12), inset 0 0 0 4px rgba(255,255,255,.6);
  margin-bottom: 18px;
}
.hero-kicker {
  display: inline-flex; gap: 6px; align-items: center; padding: 6px 16px;
  color: #a86f79; background: rgba(255,255,255,.9); border: 1px solid #f1d8d4;
  border-radius: 100px; font: 800 12px/1 var(--font); letter-spacing: .12em;
}
.hero-title {
  font: 700 clamp(32px, 5.5vw, 50px)/1.15 var(--cute); color: #774453;
  text-shadow: 1px 2px 0 #fff6ec; margin: 10px 0 6px;
}
.hero-sub {
  font-size: clamp(13px, 3.2vw, 15px); color: #866974; font-weight: 700; line-height: 1.5;
}

/* Step Progress Track */
.track-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px; border-radius: 99px; background: rgba(255,255,255,.75);
  border: 1px solid rgba(229,195,191,.7); margin: 0 auto 20px; max-width: 780px;
  box-shadow: 0 4px 15px rgba(156,97,103,.06);
}
.step-item {
  display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800;
  color: #a3818b; padding: 4px 10px; border-radius: 99px; transition: .2s;
}
.step-item.active {
  background: #d9748b; color: #fff; box-shadow: 0 3px 10px rgba(217,116,139,.3);
}
.step-item.done { color: #794556; }
.step-item .dot {
  width: 8px; height: 8px; border-radius: 50%; background: currentColor;
}

/* Screen Container */
.screen {
  background: rgba(255,255,255,.88); border: 1.5px solid #ecd8d8;
  border-radius: 28px; padding: clamp(18px, 4vw, 32px);
  box-shadow: var(--shadow); position: relative;
}
.q {
  text-align: center; font: 700 clamp(28px, 5.5vw, 40px)/1.25 var(--cute);
  color: #794556; margin: 0 0 6px;
}
.q-sub {
  text-align: center; font-size: clamp(13px, 3.2vw, 15px); color: #8a7779;
  margin: 0 0 22px; font-weight: 600;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; border-radius: 99px; font-size: 16px; font-weight: 800;
  background: #fff; border: 1.8px solid #edd5d5; color: #824f60;
  box-shadow: 0 4px 14px rgba(162,108,113,.12); transition: .2s;
}
.btn:active { transform: scale(.96); }
.btn.go {
  background: linear-gradient(135deg, #e47d95, #cc5d78); color: #fff;
  border-color: #d26781; box-shadow: 0 6px 20px rgba(217,116,139,.35);
}
.btn.gold {
  background: linear-gradient(135deg, #f4c25d, #d49c2e); color: #4e3505;
  border-color: #d1972a; box-shadow: 0 6px 20px rgba(212,156,46,.35);
}
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: #8c737a; }
.btn.lg { padding: 15px 34px; font-size: 18px; border-radius: 99px; }
.center { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

/* Font Switcher Chip Bar */
.font-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; border-radius: 99px; background: #fffcf9; border: 1.5px solid #ebd7d7;
  margin: 0 auto 16px; max-width: 680px; box-shadow: 0 3px 10px rgba(162,108,113,.06);
}
.font-bar-label { font-size: 12px; font-weight: 800; color: #9c6c79; margin-right: 4px; }
.font-chip {
  padding: 6px 14px; border-radius: 99px; background: #fff; border: 1.5px solid #e7cfd2;
  font-size: 14px; font-weight: 700; color: #7a4a58; cursor: pointer; transition: .2s;
}
.font-chip:hover { border-color: #d9748b; background: #fff2f5; }
.font-chip.on {
  background: #d9748b; color: #fff; border-color: #d9748b;
  box-shadow: 0 3px 10px rgba(217,116,139,.3);
}

/* Parent Proof Ribbon Settings */
.parent-proof-card {
  max-width: 680px; margin: 16px auto 0; padding: 14px 18px; border-radius: 18px;
  background: linear-gradient(135deg, #fffaf5, #fff2f4); border: 1.5px solid #f2cfd4;
  text-align: center; box-shadow: 0 4px 14px rgba(217,116,139,.1);
}
.parent-proof-card .pp-title {
  font: 800 13px var(--font); color: #a1445e; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.parent-proof-card .pp-desc {
  font-size: 12.5px; font-weight: 700; color: #7f5b65; margin-bottom: 8px;
}
.parent-proof-input {
  width: 100%; max-width: 480px; padding: 8px 14px; border-radius: 12px;
  border: 1.5px solid #e8c2c8; font-size: 14px; text-align: center; font-weight: 700; color: #5a3842;
  background: #fff;
}

/* Step 1: Recipients Cards */
.cards {
  display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  max-width: 820px; margin: 0 auto 20px;
}
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; min-height: 145px; padding: 16px 12px; border-radius: 22px;
  background: linear-gradient(145deg, #fff, #fff6f4); border: 2px solid #eedede;
  box-shadow: 0 6px 18px rgba(156,97,103,.08); transition: .25s; cursor: pointer;
}
.card:hover { transform: translateY(-3px); border-color: #de92a5; }
.card:active { transform: scale(.96); }
.card.on {
  border-color: #d9748b; background: linear-gradient(145deg, #fff0f3, #ffe3e8);
  box-shadow: 0 8px 24px rgba(217,116,139,.25);
}
.card .card-e { font-size: 46px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.08)); }
.card .card-w { font: 700 24px/1 var(--cute); color: #6d3a4b; }

.custom-recipient {
  max-width: 640px; margin: 0 auto; padding: 18px 20px; border-radius: 22px;
  background: #fff8f5; border: 2px dashed #f0c9ce; text-align: center;
}
.custom-recipient h3 { font: 700 22px var(--cute); color: #7f495a; margin-bottom: 8px; }
.recipient-entry {
  display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
}
.recipient-entry input {
  max-width: 280px; font-size: 18px; padding: 10px 16px; border-radius: 14px;
  border: 1.8px solid #e8cdd1; text-align: center;
}

/* Step 2: Papers Grid */
.paper-filters {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px; margin: 0 auto 16px; max-width: 820px;
}
.paper-filter {
  border-radius: 99px; padding: 8px 18px; background: #fffbf7;
  border: 1.5px solid #efd5d5; color: #9d6b7e; font-weight: 800; font-size: 14px;
  box-shadow: 0 3px 10px rgba(146,112,121,.07); transition: .2s;
}
.paper-filter.on { background: #d88098; color: #fff; border-color: #d88098; }
.papers {
  display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  max-width: 900px; margin: 0 auto;
}
.paper-card {
  position: relative; height: 210px; border-radius: 20px; overflow: hidden;
  border: 2.5px solid #ebd4d4; box-shadow: 0 7px 22px rgba(145,95,104,.1);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
  cursor: pointer; transition: .25s;
}
.paper-card:hover { transform: translateY(-3px); border-color: #d9748b; }
.paper-card.on { border-color: #d9748b; outline: 4px solid rgba(217,116,139,.3); }
.paper-card-art {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 0;
}
.paper-card .badge-season {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  background: rgba(255,255,255,.85); padding: 3px 10px; border-radius: 99px;
  font-size: 11px; font-weight: 800; color: #8e586b; border: 1px solid rgba(220,180,185,.6);
}
.paper-card .paper-card-info {
  position: relative; z-index: 2; background: rgba(255,255,255,.9);
  padding: 8px 12px; border-radius: 14px; text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.08); border: 1px solid #eed6d5;
}
.paper-card .p-name { font: 700 20px var(--cute); color: #6a3a4b; }

/* Step 3: Magic Speaking on Real Paper */
.letter-stage-wrap {
  max-width: 680px; margin: 0 auto 20px; position: relative;
}
.real-letter-canvas {
  width: 100%; height: auto; border-radius: 24px;
  box-shadow: 0 12px 36px rgba(143,99,110,.18); border: 8px solid #fff;
  display: block; background: #fffcf8;
}

/* Big Mic Control Bar */
.mic-control-bar {
  display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 18px 0;
}
.mic-big-hero {
  width: clamp(140px, 32vw, 180px); height: clamp(140px, 32vw, 180px);
  border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #ffffff, #ffe2e8); border: 5px solid #f2c8d2;
  box-shadow: 0 12px 30px rgba(217,116,139,.25), inset 0 0 0 6px #fff;
  transition: .25s; cursor: pointer;
}
.mic-big-hero:hover { transform: scale(1.03); }
.mic-big-hero:active { transform: scale(.95); }
.mic-big-hero.on {
  background: linear-gradient(145deg, #ffc7d3, #e87b92); border-color: #d95e7a;
  animation: micPulse 1.2s infinite; color: #fff;
}
@keyframes micPulse {
  0% { box-shadow: 0 0 0 0 rgba(217,116,139,.5); }
  70% { box-shadow: 0 0 0 20px rgba(217,116,139,0); }
  100% { box-shadow: 0 0 0 0 rgba(217,116,139,0); }
}
.mic-big-hero .m-icon { font-size: clamp(48px, 12vw, 64px); }
.mic-big-hero .m-label { font: 800 15px var(--font); color: #7f4455; margin-top: 4px; }
.mic-big-hero.on .m-label { color: #fff; }

.mic-status-msg {
  font-size: 15px; font-weight: 800; color: #b1516e; text-align: center;
  min-height: 22px;
}

/* Quick Speech Chips */
.chips-section {
  max-width: 780px; margin: 18px auto 20px; padding: 16px; border-radius: 20px;
  background: #fff8f5; border: 1.5px solid #f2dbdb; text-align: center;
}
.chips-title {
  font: 800 13px var(--font); color: #9c6877; letter-spacing: .08em; margin-bottom: 10px;
}
.chips-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
}
.chip-btn {
  padding: 8px 14px; border-radius: 99px; background: #fff; border: 1.5px solid #edd5d8;
  font-size: 14px; font-weight: 700; color: #754756; box-shadow: 0 2px 8px rgba(150,90,100,.08);
  transition: .2s;
}
.chip-btn:hover { border-color: #d9748b; background: #fff2f5; color: #a13d5a; transform: translateY(-1px); }
.chip-btn:active { transform: scale(.95); }

/* Manual Edit Drawer */
.edit-drawer {
  max-width: 640px; margin: 12px auto 0; text-align: center;
}
.edit-drawer textarea {
  width: 100%; min-height: 70px; padding: 12px 16px;
  border-radius: 16px; border: 1.8px solid #e8cdd1; font-family: var(--cute);
  font-size: 24px; font-weight: 700; color: #52373e; background: #fff;
}

/* Trace Mode Tools */
.trace-tools {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 99px; background: #fff; border: 1.5px solid #ebd5d5;
  box-shadow: 0 4px 15px rgba(150,90,100,.08); margin: 12px auto; max-width: 600px;
}
.swatch {
  width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.2); cursor: pointer; transition: .2s;
}
.swatch.on { transform: scale(1.2); box-shadow: 0 0 0 3px #d9748b; }

/* Step 4: Stamps & Wax Seal Selection */
.stamp-picker-section {
  max-width: 780px; margin: 18px auto 20px; padding: 18px; border-radius: 22px;
  background: #fff8f5; border: 1.5px solid #f2dbdb; text-align: center;
}
.stamp-picker-title {
  font: 800 14px var(--font); color: #9c6877; margin-bottom: 12px;
}
.stamps-grid {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
}
.stamp-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 14px; border-radius: 14px; background: #fff;
  border: 2px dashed #dcb8be; box-shadow: 0 4px 12px rgba(150,90,100,.1);
  cursor: pointer; transition: .25s; position: relative;
}
.stamp-item:hover { transform: translateY(-2px); border-color: #d9748b; }
.stamp-item.on {
  background: #fff1f4; border-color: #d9748b; border-style: solid;
  box-shadow: 0 6px 18px rgba(217,116,139,.25);
}
.stamp-item .s-ico { font-size: 36px; }
.stamp-item .s-name { font: 700 13px var(--font); color: #724452; }
.stamp-item .s-price { font-size: 10px; font-weight: 800; color: #a46c7b; background: #fdf1f3; padding: 2px 6px; border-radius: 6px; }

.wax-seal-control {
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  margin: 16px auto;
}
.gold-seal-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
  border-radius: 99px; background: linear-gradient(135deg, #fae392, #d8a032);
  border: 2px solid #b8831f; color: #4e3505; font-weight: 900; font-size: 15px;
  box-shadow: 0 4px 14px rgba(184,131,31,.35);
}

/* Step 5: Mailbox & Envelope Animation */
.envelope-post-box {
  max-width: 680px; margin: 0 auto 24px; text-align: center;
  padding: 24px 20px; border-radius: 28px;
  background: linear-gradient(180deg, #fff7f7, #ffeded); border: 2px solid #f2cdd3;
  box-shadow: 0 12px 34px rgba(217,116,139,.18);
}
.mailbox-icon-wrap {
  width: 120px; height: 120px; margin: 0 auto 12px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 64px;
  background: linear-gradient(135deg, #ff6b8b, #d93d62); color: #fff;
  box-shadow: 0 10px 25px rgba(217,61,98,.35); border: 4px solid #fff;
}
.mailbox-status-card {
  background: #fff; padding: 16px 20px; border-radius: 20px;
  border: 1.5px solid #f0ccd3; box-shadow: 0 6px 18px rgba(162,108,113,.1);
  margin: 16px auto; max-width: 520px;
}
.mailbox-status-card .p-title {
  font: 700 26px var(--cute); color: #7f3b4f; margin-bottom: 6px;
}
.mailbox-status-card .p-desc {
  font: 700 20px var(--cute); color: #81626a; line-height: 1.5;
}

/* Confetti Canvas */
#confettiCanvas {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
}

/* Print Styles: A4 Landscape with Letter & Foldable Envelope Template */
.print-only { display: none !important; }
@media print {
  @page { size: A4 landscape; margin: 6mm 8mm; }
  body, html { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  .no-print { display: none !important; }
  .print-only { display: flex !important; }
  
  .print-page {
    display: flex; width: 100%; height: 100%; gap: 16px; align-items: stretch;
    page-break-after: always;
  }
  .print-col-letter {
    flex: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1.5px solid #d8b8be; border-radius: 16px; padding: 12px; position: relative;
  }
  .print-letter-img {
    width: 100%; height: auto; max-height: 180mm; object-fit: contain; border-radius: 10px;
  }
  .print-col-envelope {
    flex: 1; border: 2px dashed #a3727d; border-radius: 16px; padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative;
    background: #fffcf9;
  }
  .print-env-header {
    text-align: center; border-bottom: 1.5px dashed #dcb3bc; padding-bottom: 8px;
  }
  .print-env-header h4 { font: 700 18px var(--cute); margin: 0; color: #7b384a; }
  .print-env-header p { font-size: 11px; margin: 3px 0 0; color: #8a646e; font-weight: 700; }
  .print-env-body {
    flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 16px;
    border: 1.5px solid #e2c0c7; border-radius: 12px; margin: 10px 0; background: #fff; position: relative;
  }
  .print-env-stamp-box {
    position: absolute; top: 12px; right: 12px; width: 44px; height: 52px;
    border: 1.5px dashed #b57a87; border-radius: 6px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 9px; color: #b57a87; text-align: center;
  }
  .print-env-to { font: 700 24px var(--cute); color: #222; margin-bottom: 12px; }
  .print-env-from { font: 700 20px var(--cute); color: #555; text-align: right; }
  
  .print-env-parent-proof {
    background: #fff3f5; border: 1.2px dashed #e8a2b0; border-radius: 8px; padding: 8px 10px;
    margin-top: 10px; text-align: center;
  }
  .print-env-parent-proof .p-proof-head {
    font: 800 11px var(--font); color: #b83d5a; margin-bottom: 3px;
  }
  .print-env-parent-proof .p-proof-body {
    font: 700 11px/1.4 var(--font); color: #6d414d;
  }

  .print-env-instructions {
    font-size: 10.5px; color: #6d4f56; line-height: 1.4; text-align: center;
    background: #fbf5f3; padding: 6px; border-radius: 8px; border: 1px dashed #ddc4c8;
  }
}
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>

<main class="app" id="app">
  <div class="top-nav no-print">
    <a href="../index.html" class="nav-link">🏠 달누리반 홈</a>
    <button type="button" class="sound-btn" id="soundToggle">🔊 소리 켜짐</button>
  </div>

/* Web Audio 소리 재생 */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function playTone(freq, type='sine', dur=0.2, gainVal=0.15) {
  if (!S.sound) return;
  try {
    if (!actx) actx = new AudioCtx();
    if (actx.state === 'suspended') actx.resume();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(gainVal, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch(e){}
}

/* TTS 음성 낭독 */
function say(txt, force=false) {
  if (!S.sound && !force) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function stopSay() {
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e){}
}

/* Helper */
const E = (t, a={}, ...k) => {
  const n = document.createElement(t);
  for (const [p, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (p === 'class') n.className = v;
    else if (p === 'text') n.textContent = v;
    else if (p === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (p.startsWith('on')) n.addEventListener(p.slice(2).toLowerCase(), v);
    else n.setAttribute(p, v);
  }
  k.flat().forEach(c => {
    if (c == null) return;
    n.append(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
};

function viewSpeak() {
  const b = document.getElementById('screenBody');
  b.innerHTML = '';
  b.append(

  );

  const stageWrap = E('div', {class: 'letter-stage-wrap'});

  stageWrap.append(cv);
  b.append(stageWrap);

  /* 귀여운 글씨체 선택 바 */
  b.append(createFontBar(() => paintLive()));

  /* 큰 마이크 */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micHero = E('button', {class: 'mic-big-hero', id: 'micHeroBtn', type: 'button'},
    E('span', {class: 'm-icon'}, '🎙️'),
    E('span', {class: 'm-label'}, '눌러서 말해요')
  );
  const statusMsg = E('div', {class: 'mic-status-msg', id: 'micStatusMsg'}, '마이크를 누르고 하고 싶은 말을 말해 보세요!');

  const micBar = E('div', {class: 'mic-control-bar'}, micHero, statusMsg);
  b.append(micBar);

  /* 꼬마 추천 말풍선 칩 (교사 없이 혼자서도 척척!) */
  const chipsSec = E('div', {class: 'chips-section'},
    E('div', {class: 'chips-title'}, '💡 무슨 말을 할지 고민된다면? 톡 눌러보세요!'),
    E('div', {class: 'chips-grid'})
  );
  const grid = chipsSec.querySelector('.chips-grid');
  QUICK_CHIPS.forEach(text => {
    const chip = E('button', {class: 'chip-btn', type: 'button', onclick: () => {
      soundTap();
      S.text = text;
      document.getElementById('manualText').value = text;
      paintLive();
      say(text);
      statusMsg.textContent = `"${text}" 예쁘게 적었어요!`;
    }}, text);
    grid.append(chip);
  });
  b.append(chipsSec);

  /* 직접 수정 상자 서랍 */
  const drawer = E('div', {class: 'edit-drawer'},
    E('textarea', {id: 'manualText', placeholder: '말한 글씨가 여기에 나와요 (직접 고칠 수도 있어요)', value: S.text}),
    E('button', {class: 'btn ghost', style: {fontSize: '13px', marginTop: '4px'}, onclick: () => say(S.text, true)}, '🔊 편지 소리 다시 듣기')
  );
  const manualInput = drawer.querySelector('#manualText');
  manualInput.oninput = () => {
    S.text = manualInput.value.slice(0, MAXCHARS);
    paintLive();
  };
  b.append(drawer);

  /* 하단 액션 버튼 */
  b.append(E('div', {class: 'center'},
    E('button', {class: 'btn ghost', onclick: () => { S.step = 1; render(); }}, '◀ 편지지 바꾸기'),
    E('button', {class: 'btn', onclick: () => { soundTap(); S.step = 35; render(); }}, '✏️ 연한 글씨 따라 쓰기'),
    E('button', {class: 'btn go lg', onclick: () => {
      soundTap(); S.strokes = []; S.step = 3; render();
    }}, '💌 우표 붙이고 도장 찍기 ▶')
  ));

  /* 캔버스 그리기 함수 */
  function paintLive() {
    const rect = stageWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(rect.width || 600);
    const H = Math.round(W * 0.72);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const p = S.paper;
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W, H);

    /* 테두리 은은한 수채화 워시 */
    ctx.save();
    function wash(x, y, r, c) {
      const g = ctx.createRadialGradient(x, y, 2, x, y, r);
      g.addColorStop(0, c + '35'); g.addColorStop(0.65, c + '15'); g.addColorStop(1, c + '00');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    wash(W * 0.1, H * 0.1, W * 0.38, p.accent);
    wash(W * 0.9, H * 0.9, W * 0.4, p.accent);
    ctx.strokeStyle = p.accent + '70'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 8]);
    ctx.strokeRect(W * 0.045, H * 0.05, W * 0.91, H * 0.9);
    ctx.setLineDash([]);
    ctx.restore();

    /* 배경 삽화 */
    const bgImg = themeImages[p.id];
    if (bgImg && bgImg.complete && bgImg.naturalWidth) {
      ctx.drawImage(bgImg, 0, 0, W, H);
    }

    /* 받는 사람 띠 */
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(W * 0.15, H * 0.065, W * 0.7, H * 0.11);
    ctx.fillStyle = '#6a3b4c';
    ctx.font = `700 ${Math.round(W * 0.055 * (S.font.scale || 1))}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${S.to.w}에게`, W * 0.5, H * 0.12);

    /* 본문 글씨 (선택된 귀여운 폰트) */
    const text = S.text.trim() || '마이크를 누르고 말을 해보세요!';
    const perLine = W < 480 ? 8 : 11;
    const lines = [];
    let cur = '';
    for (const ch of text) {
      if (ch === '\n') { lines.push(cur); cur = ''; continue; }
      cur += ch;
      if (cur.length >= perLine) { lines.push(cur); cur = ''; }
    }
    if (cur) lines.push(cur);

    const displayLines = lines.slice(0, 4);
    const size = Math.min(Math.round(W * 0.082 * (S.font.scale || 1)), Math.round(H / (displayLines.length + 3.2)));
    ctx.font = `700 ${size}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = H * 0.27, gap = size * 1.35;

    displayLines.forEach((ln, i) => {
      const y = top + gap * i + size * 0.5;
      ctx.strokeStyle = p.line; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W * 0.08, y + size * 0.45); ctx.lineTo(W * 0.92, y + size * 0.45); ctx.stroke();
      ctx.fillStyle = S.text ? '#422c33' : '#b8a6a9';
      ctx.fillText(ln, W * 0.5, y);
    });

    /* 보내는 사람 */
    if (S.from) {
      ctx.fillStyle = '#7a5a64'; ctx.textAlign = 'right';
      ctx.font = `700 ${Math.round(W * 0.048 * (S.font.scale || 1))}px ${S.font.family}`;
      ctx.fillText(`${S.from} 올림 💌`, W * 0.92, H * 0.92);
    }

    /* 부모님 어필 자율 인증 리본 띠 (하단 중앙) */
    if (S.showParentProof) {
      const proofMsg = S.parentProofCustom || `🌱 선생님 도움 없이 ${S.from}가 스스로 말하고 완성했어요! 💌`;
      ctx.save();
      const rw = Math.min(W * 0.76, 460), rh = H * 0.065;
      const rx = (W - rw) / 2, ry = H * 0.81;
      ctx.fillStyle = 'rgba(255, 245, 246, 0.92)';
      ctx.shadowColor = 'rgba(217,116,139,0.12)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(rx, ry, rw, rh, 99) : ctx.rect(rx, ry, rw, rh); ctx.fill();
      ctx.strokeStyle = 'rgba(224, 142, 160, 0.65)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#9e3f5b';
      ctx.font = `800 ${Math.round(W * 0.027)}px var(--font)`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(proofMsg, W * 0.5, ry + rh * 0.52);
      ctx.restore();
    }

    /* 우표 자리 미리보기 */
    ctx.strokeStyle = p.accent + '80'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]);
    ctx.strokeRect(W * 0.82, H * 0.07, W * 0.12, H * 0.18);
    ctx.setLineDash([]);
    ctx.fillStyle = p.accent; ctx.font = `700 ${Math.round(W * 0.026)}px var(--font)`;
    ctx.textAlign = 'center'; ctx.fillText('우표', W * 0.88, H * 0.16);

    S.canvas = cv;
  }

  setTimeout(paintLive, 100);

  /* 음성인식 엔진 연결 */
  let rec = null, isRecording = false;
  micHero.onclick = () => {
    if (!SR) { manualInput.focus(); return; }
    if (isRecording) { rec && rec.stop(); return; }
    soundMicStart();
    try {
      rec = new SR();
      rec.lang = 'ko-KR'; rec.continuous = false; rec.interimResults = true;
      rec.onstart = () => {
        isRecording = true;
        micHero.classList.add('on');
        micHero.querySelector('.m-icon').textContent = '⏹️';
        micHero.querySelector('.m-label').textContent = '다 말했어요';
        statusMsg.textContent = '귀 기울여 듣고 있어요… 말씀해 주세요!';
      };
      rec.onresult = (e) => {
        let txt = ''; for (let i=0; i<e.results.length; i++) txt += e.results[i][0].transcript;
        S.text = txt.trim().slice(0, MAXCHARS);
        manualInput.value = S.text;
        paintLive();
      };
      rec.onerror = (ev) => {
        statusMsg.textContent = ev.error === 'not-allowed'
          ? '마이크 사용을 허용해 주세요.'
          : '잘 못 들었어요. 천천히 다시 말해 볼까요?';
      };
      rec.onend = () => {
        isRecording = false;
        micHero.classList.remove('on');
        micHero.querySelector('.m-icon').textContent = '🎙️';
        micHero.querySelector('.m-label').textContent = '눌러서 말해요';
        statusMsg.textContent = '멋진 편지가 써졌어요! 아래 버튼을 눌러 우표를 붙여봐요.';
        paintLive();
        if (S.text) say(`${S.to.w}에게 보낼 편지가 써졌어요!`);
      };
      rec.start();
    } catch(err) {
      statusMsg.textContent = '음성인식을 시작하지 못했어요. 아래 칩이나 키보드를 써주세요.';
    }
  };
}

  ));

  let ctx, W, H, dpr;
  function layoutTrace() {
    const rect = stageWrap.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(rect.width || 600);

    /* 배경 삽화 */
    const bgImg = themeImages[p.id];
    if (bgImg && bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg, 0, 0, W, H);

    /* 받는 사람 */
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(W * 0.15, H * 0.065, W * 0.7, H * 0.11);
    ctx.fillStyle = '#6a3b4c';
    ctx.font = `700 ${Math.round(W * 0.055 * (S.font.scale || 1))}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${S.to.w}에게`, W * 0.5, H * 0.12);

    /* 회색 밑글씨 */
    const text = S.text.trim();
    const perLine = W < 480 ? 8 : 11;
    const lines = [];
    let cur = '';
    for (const ch of text) {
      cur += ch;
      if (cur.length >= perLine) { lines.push(cur); cur = ''; }
    }
    if (cur) lines.push(cur);

    const displayLines = lines.slice(0, 4);
    const size = Math.min(Math.round(W * 0.082 * (S.font.scale || 1)), Math.round(H / (displayLines.length + 3.2)));
    ctx.font = `700 ${size}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = H * 0.27, gap = size * 1.35;

    displayLines.forEach((ln, i) => {
      const y = top + gap * i + size * 0.5;
      ctx.strokeStyle = p.line; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W * 0.08, y + size * 0.45); ctx.lineTo(W * 0.92, y + size * 0.45); ctx.stroke();
      ctx.fillStyle = '#CFC7BD';
      ctx.fillText(ln, W * 0.5, y);
    });

    if (S.from) {
      ctx.fillStyle = '#7a5a64'; ctx.textAlign = 'right';
      ctx.font = `700 ${Math.round(W * 0.048 * (S.font.scale || 1))}px ${S.font.family}`;
      ctx.fillText(`${S.from} 올림 💌`, W * 0.92, H * 0.92);
    }

    /* 아이가 직접 그린 선 */
    S.strokes.forEach(s => {
      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
      ctx.beginPath();
      s.p.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
      ctx.stroke();
    });

    S.canvas = cv;
  }

  let drawing = false;
  const getPos = e => {
    const r = cv.getBoundingClientRect(); const q = e.touches ? e.touches[0] : e;
    return {x: q.clientX - r.left, y: q.clientY - r.top};
  };
  const startD = e => { e.preventDefault(); drawing = true; S.strokes.push({c: S.color, w: S.width, p: [getPos(e)]}); paintTrace(); };
  const moveD = e => { if (!drawing) return; e.preventDefault(); S.strokes[S.strokes.length-1].p.push(getPos(e)); paintTrace(); };
  const endD = () => { drawing = false; };

  cv.addEventListener('pointerdown', startD);
  cv.addEventListener('pointermove', moveD);
  window.addEventListener('pointerup', endD);

  layoutTrace(); paintTrace();
}

/* ============================================================
   4단계: 우표 붙이기 & 왁스 실링 도장 (부모님 어필 문구 탑재!)
   ============================================================ */
function viewStampAndSeal() {
  const b = document.getElementById('screenBody');
  b.innerHTML = '';
  b.append(
    E('h2', {class: 'q'}, '우표를 붙이고 달누리 도장을 쾅! 찍어요'),
    E('p', {class: 'q-sub'}, '진짜 편지처럼 우표를 붙이고 부모님 감동 인증 띠와 황금 왁스 도장으로 완성해요')
  );

  /* 편지 완성본 미리보기 캔버스 */
  const stageWrap = E('div', {class: 'letter-stage-wrap'});
  const cv = E('canvas', {class: 'real-letter-canvas', id: 'stampedCanvas'});
  stageWrap.append(cv);
  b.append(stageWrap);

  /* 글씨체 바 */
  b.append(createFontBar(() => paintFinal()));

  /* 부모님 어필 자율 인증 문구 설정 카드 */
  const ppCard = E('div', {class: 'parent-proof-card'},
    E('div', {class: 'pp-title'}, '💖 부모님 감동 어필 문구 (편지 맨 밑에 들어가요)'),
    E('div', {class: 'pp-desc'}, '아이들이 선생님 도움 없이 스스로 말해서 완성했다는 사실을 부모님께 자랑스럽게 알려드려요!'),
    E('input', {
      class: 'parent-proof-input',
      id: 'parentProofInput',
      value: S.parentProofCustom || `🌱 선생님 도움 없이 ${S.from}가 스스로 말하고 완성했어요! 💌`,
      placeholder: '예: 🌱 선생님 도움 없이 스스로 말하고 완성했어요! 💌'
    }),
    E('div', {class: 'center', style: {marginTop: '8px', gap: '8px'}},
      E('button', {class: 'btn', style: {padding: '5px 14px', fontSize: '13px'}, onclick: () => {
        S.showParentProof = !S.showParentProof;
        ppCard.querySelector('#toggleProofBtn').textContent = S.showParentProof ? '✅ 인증 문구 보이기 (켜짐)' : '❌ 인증 문구 숨기기 (꺼짐)';
        paintFinal();
      }, id: 'toggleProofBtn'}, S.showParentProof ? '✅ 인증 문구 보이기 (켜짐)' : '❌ 인증 문구 숨기기 (꺼짐)')
    )
  );
  ppCard.querySelector('#parentProofInput').oninput = (e) => {
    S.parentProofCustom = e.target.value.trim();
    safeSet('letter.parentProof', S.parentProofCustom);
    paintFinal();
  };
  b.append(ppCard);

  /* 우표 선택 바 */
  const stampSec = E('div', {class: 'stamp-picker-section'},
    E('div', {class: 'stamp-picker-title'}, '🏣 마음에 드는 진짜 수채화 우표를 골라보세요!'),
    E('div', {class: 'stamps-grid'})
  );
  const sGrid = stampSec.querySelector('.stamps-grid');
  STAMPS.forEach(st => {
    const isSel = S.stamp.id === st.id;
    const card = E('button', {class: 'stamp-item' + (isSel ? ' on' : ''), type: 'button', onclick: () => {
      soundStamp(); S.stamp = st;
      stampSec.querySelectorAll('.stamp-item').forEach(x => x.classList.remove('on'));
      card.classList.add('on');
      paintFinal();
    }},
      E('span', {class: 's-ico'}, st.e),
      E('span', {class: 's-name'}, st.name),
      E('span', {class: 's-price'}, st.fee)
    );
    sGrid.append(card);
  });
  b.append(stampSec);

  /* 왁스 도장 토글 & 보내는 사람 이름 입력 */
  const sealBar = E('div', {class: 'wax-seal-control'},
    E('button', {class: 'btn gold', type: 'button', onclick: () => {
      soundSeal(); S.hasSeal = !S.hasSeal; paintFinal();
    }}, S.hasSeal ? '🔏 달누리 골드 왁스 도장 찍힘 (쾅!)' : '🔏 도장 찍기')
  );
  b.append(sealBar);

  const fromRow = E('div', {class: 'center', style: {marginTop: '10px'}},
    E('label', {style: {fontWeight: '800', color: '#7a5a64'}}, '보내는 사람:'),
    E('input', {id: 'fromInput', value: S.from, placeholder: '내 이름 (예: 도윤이)', style: {maxWidth: '180px', padding: '8px 14px', borderRadius: '12px', border: '1.8px solid #ecd0d0', fontSize: '16px', textAlign: 'center'}})
  );
  fromRow.querySelector('#fromInput').oninput = (e) => {
    S.from = e.target.value.trim(); safeSet('letter.from', S.from);
    if (!S.parentProofCustom) {
      document.getElementById('parentProofInput').value = `🌱 선생님 도움 없이 ${S.from}가 스스로 말하고 완성했어요! 💌`;
    }
    paintFinal();
  };
  b.append(fromRow);

  b.append(E('div', {class: 'center', style: {marginTop: '20px'}},
    E('button', {class: 'btn ghost', onclick: () => { S.step = 2; render(); }}, '◀ 다시 쓰기'),
    E('button', {class: 'btn go lg', onclick: () => {
      soundMailbox(); S.step = 4; render();
    }}, '📮 편지봉투에 넣고 우체통에 보내기 ▶')
  ));

  function paintFinal() {
    const rect = stageWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(rect.width || 600);
    const H = Math.round(W * 0.72);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const p = S.paper;
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W, H);

    /* 배경 삽화 */
    const bgImg = themeImages[p.id];
    if (bgImg && bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg, 0, 0, W, H);

    /* 테두리 */
    ctx.strokeStyle = p.accent + '70'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 8]);
    ctx.strokeRect(W * 0.045, H * 0.05, W * 0.91, H * 0.9);
    ctx.setLineDash([]);

    /* 받는 사람 */
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(W * 0.12, H * 0.065, W * 0.65, H * 0.11);
    ctx.fillStyle = '#6a3b4c';
    ctx.font = `700 ${Math.round(W * 0.055 * (S.font.scale || 1))}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${S.to.w}에게`, W * 0.44, H * 0.12);

    /* 우표 붙이기 */
    const stX = W * 0.82, stY = H * 0.06, stW = W * 0.13, stH = H * 0.22;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    ctx.fillRect(stX, stY, stW, stH);
    ctx.strokeStyle = S.stamp.color; ctx.lineWidth = 1.8; ctx.strokeRect(stX + 2, stY + 2, stW - 4, stH - 4);
    ctx.restore();

    ctx.fillStyle = S.stamp.color;
    ctx.font = `${Math.round(stH * 0.45)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.stamp.e, stX + stW / 2, stY + stH * 0.42);

    ctx.font = `800 ${Math.round(stW * 0.18)}px var(--font)`;
    ctx.fillText('달누리우체국', stX + stW / 2, stY + stH * 0.8);

    /* 우편 소인 도장 */
    ctx.save();
    ctx.strokeStyle = 'rgba(90, 45, 55, 0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(stX + stW * 0.3, stY + stH * 0.85, stW * 0.4, 0, Math.PI * 2); ctx.stroke();
    ctx.font = `800 ${Math.round(stW * 0.16)}px var(--font)`; ctx.fillStyle = 'rgba(90, 45, 55, 0.55)';
    ctx.fillText('달누리', stX + stW * 0.3, stY + stH * 0.85);
    ctx.restore();

    /* 본문 글씨 */
    const text = S.text.trim() || '사랑하는 마음을 전해요!';
    const perLine = W < 480 ? 8 : 11;
    const lines = [];
    let cur = '';
    for (const ch of text) {
      cur += ch;
      if (cur.length >= perLine) { lines.push(cur); cur = ''; }
    }
    if (cur) lines.push(cur);

    const displayLines = lines.slice(0, 4);
    const size = Math.min(Math.round(W * 0.082 * (S.font.scale || 1)), Math.round(H / (displayLines.length + 3.2)));
    ctx.font = `700 ${size}px ${S.font.family}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = H * 0.27, gap = size * 1.35;

    displayLines.forEach((ln, i) => {
      const y = top + gap * i + size * 0.5;
      ctx.strokeStyle = p.line; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W * 0.08, y + size * 0.45); ctx.lineTo(W * 0.92, y + size * 0.45); ctx.stroke();
      ctx.fillStyle = '#422c33';
      ctx.fillText(ln, W * 0.5, y);
    });

    /* 따라 쓴 선 오버레이 */
    S.strokes.forEach(s => {
      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
      ctx.beginPath();
      s.p.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
      ctx.stroke();
    });

    /* 보내는 사람 */
    if (S.from) {
      ctx.fillStyle = '#7a5a64'; ctx.textAlign = 'right';
      ctx.font = `700 ${Math.round(W * 0.048 * (S.font.scale || 1))}px ${S.font.family}`;
      ctx.fillText(`${S.from} 올림 💌`, W * 0.92, H * 0.92);
    }

    /* 왁스 실링 골드 도장 */
    if (S.hasSeal) {
      const sealX = W * 0.16, sealY = H * 0.85, sealR = W * 0.065;
      ctx.save();
      const sealGrad = ctx.createRadialGradient(sealX - 4, sealY - 4, 3, sealX, sealY, sealR);
      sealGrad.addColorStop(0, '#fde68a'); sealGrad.addColorStop(0.7, '#d97706'); sealGrad.addColorStop(1, '#92400e');
      ctx.fillStyle = sealGrad;
      ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.beginPath(); ctx.arc(sealX, sealY, sealR, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#b45309'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(sealX, sealY, sealR * 0.82, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = '#78350f'; ctx.font = `900 ${Math.round(sealR * 0.42)}px var(--font)`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('달누리', sealX, sealY - sealR * 0.18);
      ctx.font = `700 ${Math.round(sealR * 0.3)}px var(--font)`;
      ctx.fillText('우체국', sealX, sealY + sealR * 0.3);
      ctx.restore();
    }

    /* 부모님 어필 자율 인증 리본 띠 (하단 중앙) */
    if (S.showParentProof) {
      const proofMsg = S.parentProofCustom || `🌱 선생님 도움 없이 ${S.from}가 스스로 말하고 완성했어요! 💌`;
      ctx.save();
      const rw = Math.min(W * 0.74, 460), rh = H * 0.065;
      const rx = (W - rw) / 2, ry = H * 0.81;
      ctx.fillStyle = 'rgba(255, 245, 246, 0.94)';
      ctx.shadowColor = 'rgba(217,116,139,0.12)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(rx, ry, rw, rh, 99) : ctx.rect(rx, ry, rw, rh); ctx.fill();
      ctx.strokeStyle = 'rgba(224, 142, 160, 0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#9e3f5b';
      ctx.font = `800 ${Math.round(W * 0.026)}px var(--font)`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(proofMsg, W * 0.5, ry + rh * 0.52);
      ctx.restore();
    }

    S.canvas = cv;
  }

  setTimeout(paintFinal, 100);
}

}

function downloadPNG() {
  if (!S.canvas) return;
  S.canvas.toBlob(blob => {
    const a = E('a', {
      href: URL.createObjectURL(blob),
      download: `달누리편지_${S.to.w}에게_${S.from}올림_${new Date().toISOString().slice(0,10)}.png`
    });
    document.body.append(a); a.click(); a.remove();
  });
}

function resetAll() {
  S.step = 0; S.strokes = []; S.isPosted = false;
  S.text = '사랑해요 언제나 고마워요';
  render();
}

/* 색종이 폭죽 (Confetti) */
function launchConfetti() {
  const cv = document.getElementById('confettiCanvas');
  const ctx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const particles = [];
  const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
  for (let i=0; i<120; i++) {
    particles.push({
      x: cv.width / 2 + (Math.random() - 0.5) * 200,
      y: cv.height * 0.45,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.8) * 16,
      size: Math.random() * 9 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8
    });
  }
  let animId;
  function update() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    });
    if (particles.some(p => p.y < cv.height)) {
      animId = requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, cv.width, cv.height);
    }
  }
  update();
}

/* 전체 화면 렌더러 */
function render() {
  renderTrack();
  if (S.step === 0) viewTo();
  else if (S.step === 1) viewPaper();
  else if (S.step === 2) viewSpeak();
  else if (S.step === 35) viewTrace();
  else if (S.step === 3) viewStampAndSeal();
  else if (S.step === 4) viewPostAndPrint();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* 소리 토글 */
document.getElementById('soundToggle').onclick = (e) => {
  S.sound = !S.sound;
  e.target.textContent = S.sound ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
};

render();
</script>
