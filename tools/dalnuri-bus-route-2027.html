<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027학년도 통학차량 예상 노선도 | 대전동산초등학교병설유치원</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ink:#17233B; --muted:#6B7A90; --line:#E3DCCD; --paper:#FBF7EF; --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:18px 18px 28px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .eyebrow{font-size:12.5px;letter-spacing:.02em;color:var(--muted);margin:0 0 4px}
  h1{margin:0;font-size:clamp(20px,3.2vw,30px);letter-spacing:-.02em;line-height:1.2}
  .tools{display:flex;gap:8px;align-items:center}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;
    padding:10px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:#C9BFA9}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .tab{
    border:1.6px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;
    font-size:14px;font-weight:800;color:#5C6A7E;cursor:pointer;transition:.15s;
  }
  .tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .tab.active{color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(23,35,59,.16)}
  .tab.active .dot{background:#fff !important}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--ink);font-size:14px;margin-left:6px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(23,35,59,.06)}
  #map{height:min(66vh,640px);border-radius:20px;overflow:hidden}
  .panel{padding:16px 16px 12px}
  .panel h2{margin:2px 0 2px;font-size:17px;letter-spacing:-.01em}
  .panel p.sub{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
  .rows{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:26px 1fr auto 96px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #F0EBE1}
  .row:first-child{border-top:none}
  .row{cursor:pointer}
  .row:hover{background:#FBFAF6}
  .num{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
  .sname{font-size:13.5px;font-weight:700;line-height:1.25}
  .stime{font-size:14px;font-weight:800;white-space:nowrap}
  .row input{
    width:100%;border:1px dashed #D9D0BE;border-radius:9px;padding:7px 8px;font-size:13px;
    font-family:inherit;background:#FCFAF5;color:var(--ink);
  }
  .row input:focus{outline:2px solid #CFE0FF;border-color:#9DBDF2}
  .pin-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F2C14E;margin-left:5px;vertical-align:middle}
  .leaflet-popup-content{font-family:inherit;margin:12px 14px}
  .pop-name{font-size:15px;font-weight:800;margin:0 0 2px}
  .pop-time{font-size:13px;font-weight:800;margin:0 0 8px}
  .pop-note{font-size:11.5px;color:#6B7A90;margin:0 0 8px;line-height:1.4}
  .pop-links{display:flex;gap:6px;flex-wrap:wrap}
  .pop-links a{
    text-decoration:none;font-size:12px;font-weight:800;color:var(--ink);
    border:1px solid #E3DCCD;border-radius:8px;padding:6px 9px;background:#fff;
  }
  .pop-links a.naver{color:#03C75A;border-color:#B9EBD0}
  .pop-links a.google{color:#1A73E8;border-color:#C6DBFB}
  .pop-links a.kakao{color:#3A1D1D;border-color:#F5DE6E;background:#FEE500}
  .stop-pin{
    width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;
    box-shadow:0 3px 10px rgba(23,35,59,.28);font-weight:800;color:#fff;font-size:15px;
  }
  .stop-pin span{width:27px;height:27px;border-radius:50%;display:grid;place-items:center}
  .school-pin{font-size:30px;line-height:1;filter:drop-shadow(0 3px 6px rgba(23,35,59,.35))}
  .school-wrap{position:relative;width:34px;height:34px;display:grid;place-items:center}
  .school-label{
    position:absolute;top:32px;left:50%;transform:translateX(-50%);
    background:#fff;border:1px solid #E3DCCD;border-radius:9px;padding:3px 9px;
    font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(23,35,59,.16);color:#17233B;
  }
  .arrow{width:0;height:0}
  footer{margin-top:16px;font-size:12px;color:#8A94A4;line-height:1.6}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:22px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}

  @media (max-width:980px){
    main{grid-template-columns:1fr}
    #map{height:56vh}
    .row{grid-template-columns:24px 1fr auto;grid-template-areas:"n s t" "n i i"}
    .row .num{grid-area:n}.row .sname{grid-area:s}.row .stime{grid-area:t}.row input{grid-area:i}
  }

  @page{size:A3 landscape;margin:10mm}
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .tools,.tabs,.meta,.legend,footer{display:none !important}
    header{margin:0 0 6mm}
    h1{font-size:24pt}
    .eyebrow{font-size:9pt}
    main{grid-template-columns:1fr 340px;gap:8mm}
    .card{box-shadow:none;border:1px solid #DDD6C6;border-radius:6mm}
    #map{height:180mm !important;border-radius:6mm}
    .panel h2{font-size:14pt}
    .row{padding:6mm 0}
    .sname{font-size:11pt}
    .stime{font-size:12pt}
    .row input{border-bottom:1px solid #BBB;border-radius:0;background:transparent;height:11mm}
  }
</style>
</head>

const $ = s => document.querySelector(s);
let active = DATA.courses[0].id;
let showAll = false;
let markers = {};

const map = L.map('map', {zoomControl:true, attributionControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const layer = L.layerGroup().addTo(map);

function bearing(a, b){
  const dx = b[1]-a[1], dy = b[0]-a[0];
  return Math.atan2(dx, dy) * 180 / Math.PI;
}

function arrowIcon(angle, color){
  return L.divIcon({className:'', iconSize:[18,18],
    html:`<div style="transform:rotate(${angle}deg);width:18px;height:18px;display:grid;place-items:center">
      <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid ${color};opacity:.96;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))"></div></div>`});
}

function naverUrl(s){ return `https://map.naver.com/p?c=${s.lon},${s.lat},17,0,0,0,dh`; }
function googleUrl(s){ return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`; }

function stopPopup(key, time){
  const s = DATA.stops[key];
  const kakao = s.kakao ? `<a class="kakao" href="${s.kakao}" target="_blank" rel="noopener">카카오맵</a>` : '';
  return `<div class="pop-name">${s.name}${s.ok?'':' <span style="font-size:11px;color:#B8860B">(위치 확인 중)</span>'}</div>
    <div class="pop-time">${time}</div>
    ${s.note?`<div class="pop-note">${s.note}</div>`:''}
    <div class="pop-links">
      <a class="naver" href="${naverUrl(s)}" target="_blank" rel="noopener">네이버 지도</a>
      <a class="google" href="${googleUrl(s)}" target="_blank" rel="noopener">구글 지도</a>
      ${kakao}
    </div>`;
}

function drawCourse(c, dim){
  const stops = c.stops.map(s => ({...s, ...DATA.stops[s.key]}));
  const line = L.polyline(c.path, {color:'#fff', weight:11, opacity:dim?0.35:0.95, lineJoin:'round'}).addTo(layer);
  L.polyline(c.path, {color:c.color, weight:7, opacity:dim?0.55:1, lineJoin:'round'}).addTo(layer);

  // 진행 방향 화살표
  let acc = 0, next = 210;
  for (let i=1;i<c.path.length;i++){
    const a = c.path[i-1], b = c.path[i];
    const d = map.distance(L.latLng(a), L.latLng(b));
    acc += d;
    if (acc > next){
      next += 210;
      const ang = bearing(a,b);
      L.marker(b, {icon: arrowIcon(ang, '#fff'), interactive:false, keyboard:false}).addTo(layer);
    }
  }

  markers = {};
  stops.forEach((s, i) => {
    const icon = L.divIcon({className:'', iconSize:[34,34],
      html:`<div class="stop-pin" style="background:#fff"><span style="background:${c.color}">${i+1}</span></div>`});
    const mk = L.marker([s.lat, s.lon], {icon, title:s.name}).addTo(layer)
      .bindPopup(stopPopup(s.key, s.time), {maxWidth:260});
    markers[s.key] = mk;
  });

  const k = DATA.kinder;
  L.marker([k.lat, k.lon], {icon: L.divIcon({className:'', iconSize:[34,34], iconAnchor:[17,17],
      html:`<div class="school-wrap"><div class="school-pin">🏫</div><div class="school-label">유치원</div></div>`}),
    title:k.full, zIndexOffset:500}).addTo(layer)
    .bindPopup(`<div class="pop-name">${k.full}</div>
      <div class="pop-time">출발 ${c.start} · 도착 ${c.end}</div>
      <div class="pop-links"><a class="naver" href="https://map.naver.com/p?c=${k.lon},${k.lat},17,0,0,0,dh" target="_blank">네이버 지도</a>
      <a class="google" href="https://www.google.com/maps/search/?api=1&query=${k.lat},${k.lon}" target="_blank">구글 지도</a></div>`);
  return line;
}

function render(){
  layer.clearLayers();
  const bounds = [];
  if (showAll){
    DATA.courses.forEach(c => {
      drawCourse(c, true);
      c.path.forEach(p => bounds.push(p));
    });
  } else {
    const c = DATA.courses.find(x => x.id === active);
    drawCourse(c, false);
    c.path.forEach(p => bounds.push(p));
  }
  bounds.push([DATA.kinder.lat, DATA.kinder.lon]);
  map.fitBounds(bounds, {padding:[36,36]});
  renderMeta();
  renderRows();
  renderTabs();
}

function renderTabs(){
  $('#tabs').innerHTML = DATA.courses.map(c => {
    const on = !showAll && c.id === active;
    return `<button class="tab ${on?'active':''}" data-id="${c.id}"
      style="${on?`background:${c.color}`:''}">
      <span class="dot" style="background:${c.color}"></span>${c.badge}</button>`;
  }).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    active = b.dataset.id; showAll = false; render();
  });
}

function renderMeta(){
  let el = $('#meta');
  if (showAll){
    el.innerHTML = `<span class="chip">등·하원 4개 코스 전체</span>
      <span class="chip">등원 <b>07:55 ~ 09:00</b></span><span class="chip">하원 <b>16:30 ~ 17:45</b></span>`;
    return;
  }
  const c = DATA.courses.find(x => x.id === active);
  el.innerHTML = `<span class="chip" style="border-color:${c.color};color:${c.color};font-weight:800">${c.badge}</span>
    <span class="chip">운행시간<b>${c.time}</b></span>
    <span class="chip">소요시간<b>${c.dur}</b></span>
    <span class="chip">정류장<b>${c.stops.length}곳</b></span>`;
}

function renderRows(){
  const box = $('#rows');
  if (showAll){
    box.innerHTML = `<p class="sub" style="margin:6px 0 0">코스를 선택하면 정류장별 이름 칸이 나옵니다.</p>`;
    return;
  }
  const c = DATA.courses.find(x => x.id === active);
  box.innerHTML = c.stops.map((s, i) => {
    const d = DATA.stops[s.key];
    const saved = localStorage.getItem('bus2027:' + c.id + ':' + s.key) || '';
    return `<div class="row" data-key="${s.key}">
      <div class="num" style="background:${c.color}">${i+1}</div>
      <div class="sname">${d.name}${d.ok?'':'<span class="pin-dot" title="위치 확인 중"></span>'}</div>
      <div class="stime" style="color:${c.color}">${s.time}</div>
      <input data-course="${c.id}" data-key="${s.key}" placeholder="자녀 이름" value="${saved}">
    </div>`;
  }).join('');
  box.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => localStorage.setItem('bus2027:' + inp.dataset.course + ':' + inp.dataset.key, inp.value.trim());
  });
  box.querySelectorAll('.row').forEach(r => {
    r.onclick = (ev) => {
      if (ev.target.tagName === 'INPUT') return;
      const mk = markers[r.dataset.key];
      if (mk){ map.flyTo(mk.getLatLng(), 17, {duration:.7}); setTimeout(() => mk.openPopup(), 450); }
    };
  });
}

$('#allBtn').onclick = () => { showAll = !showAll; render(); $('#allBtn').textContent = showAll ? '코스별로 보기' : '4개 코스 한눈에'; };
$('#printBtn').onclick = () => { map.invalidateSize(); setTimeout(() => window.print(), 350); };
window.addEventListener('beforeprint', () => map.invalidateSize());
window.addEventListener('resize', () => map.invalidateSize());

render();
</script>
