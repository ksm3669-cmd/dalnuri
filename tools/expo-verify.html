<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>검증 프레임</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}
#f{border:0;display:block;background:#fff;transform-origin:top left}</style>
</head><body>
<script>
var p=new URLSearchParams(location.search);
var w=+(p.get('w')||1440), h=+(p.get('h')||900), y=+(p.get('y')||0), sc=+(p.get('sc')||1);
var f=document.createElement('iframe');
f.id='f'; f.width=w; f.height=h;
f.style.width=w+'px'; f.style.height=h+'px';
if(sc!==1){f.style.transform='scale('+sc+')';}
f.onload=function(){ setTimeout(function(){ try{ f.contentWindow.scrollTo(0, y); }catch(e){} }, 400); };
f.src='./expo-2026-archive.html'+(p.get('hash')||'#slide-28');
document.body.appendChild(f);
</script>
</body></html>
