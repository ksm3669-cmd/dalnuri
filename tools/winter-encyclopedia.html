<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>달누리반 겨울 백과사전 (단독 앱)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --primary-light: #E0F2FE;
      --accent: #E07A38;
      --bg: #F0F9FF;
      --card-bg: #FFFFFF;
      --text: #0C4A6E;
      --text-sub: #475569;
      --border: #BAE6FD;
      --radius: 20px;
      --shadow: 0 8px 24px rgba(2, 132, 199, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Jua', 'Pretendard', sans-serif;
      background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 30%, #F8FAFC 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      padding-bottom: 40px;
    }

    header.app-header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 2.2rem;
      background: var(--primary-light);
      border: 2px solid #7DD3FC;
      border-radius: 16px;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title h1 {
      font-size: 1.45rem;
      color: #0369A1;
      line-height: 1.1;
    }

    .brand-title p {
      font-family: 'Pretendard', sans-serif;
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 7px 16px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-light);
      border-color: #7DD3FC;
    }

    .btn-quiz {
      background: #22C55E;
      border-color: #16A34A;
      color: #FFFFFF;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
    }
    .btn-quiz:hover {
      background: #16A34A;
    }

    main.container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: none;
    }
    .category-chips::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 9px 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .ency-card {
      background: #FFFFFF;
      border: 3px solid #E0F2FE;
      border-radius: var(--radius);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.06);
      position: relative;
    }

    .ency-card:hover {
      transform: translateY(-5px);
      border-color: #38BDF8;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.15);
    }

    .ency-card:active {
      transform: scale(0.97);
    }

    .card-emoji {
      font-size: 4.2rem;
      line-height: 1;
      margin: 8px 0 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
    }

    .card-tag {
      background: var(--primary-light);
      color: #0369A1;
      border: 1px solid #BAE6FD;
      font-family: 'Pretendard', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.25rem;
      color: #0C4A6E;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .card-desc {
      font-family: 'Pretendard', sans-serif;
      font-size: 0.88rem;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 12px;
      flex: 1;
    }

    .card-listen-btn {
      background: #F0F9FF;
      border: 1.5px solid #BAE6FD;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.92rem;
      color: #0284C7;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s;
    }

    .ency-card:hover .card-listen-btn {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 74, 110, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 520px;
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 20px 48px rgba(12, 74, 110, 0.2);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      text-align: center;
    }

    .modal-overlay.open .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-emoji {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 12px;
    }

    .modal-tag {
      display: inline-block;
      background: var(--primary-light);
      border: 1px solid #7DD3FC;
      color: #0284C7;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1.6rem;
      color: #0C4A6E;
      margin-bottom: 16px;
    }

    .modal-story-box {
      background: #F8FAFC;
      border: 2px dashed #BAE6FD;
      border-radius: 18px;
      padding: 18px;
      font-family: 'Pretendard', sans-serif;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #334155;
      text-align: left;
      margin-bottom: 20px;
      max-height: 260px;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-modal {
      flex: 1;
      padding: 13px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.2s;
    }

    .btn-speak {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }
    .btn-speak:hover { background: var(--primary-hover); }

    .btn-close {
      background: #E2E8F0;
      color: #475569;
    }
    .btn-close:hover { background: #CBD5E1; }

    /* Quiz Modal */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 18px 0 12px;
    }

    .quiz-btn {
      width: 100%;
      background: #F0F9FF;
      border: 2px solid #BAE6FD;
      border-radius: 16px;
      padding: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #0369A1;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .quiz-result {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">❄️</div>
      <div class="brand-title">
        <h1>달누리 겨울 백과사전</h1>
        <p>유아 탐구 패드 전용 · 동식물 겨울나기, 날씨, 간식, 놀이 24종</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-action btn-quiz" onclick="openQuizModal()">
        <span>💡</span> <span>알쏭달쏭 겨울 퀴즈</span>
      </button>
      <button class="btn-action" onclick="toggleFullscreen()">
        <span>⛶</span> <span>전체화면</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Category Chips -->
    <div class="category-chips" id="catChips">
      <button class="chip-btn active" onclick="filterCategory('all', this)"><span>🌟</span> 전체보기 (24)</button>
      <button class="chip-btn" onclick="filterCategory('animal', this)"><span>🐾</span> 동물의 겨울나기</button>
      <button class="chip-btn" onclick="filterCategory('plant', this)"><span>🌲</span> 식물의 겨울나기</button>
      <button class="chip-btn" onclick="filterCategory('weather', this)"><span>🧣</span> 날씨와 옷차림</button>
      <button class="chip-btn" onclick="filterCategory('food', this)"><span>🍠</span> 따끈따끈 겨울 간식</button>
      <button class="chip-btn" onclick="filterCategory('play', this)"><span>🛷</span> 신나는 겨울 놀이</button>
      <button class="chip-btn" onclick="filterCategory('safety', this)"><span>🦺</span> 안전한 겨울나기</button>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="encyGrid">
      <!-- Populated via JS -->
    </div>
  </main>

  <!-- Detail Story Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <div class="modal-emoji" id="modalEmoji">🐻</div>
      <div class="modal-tag" id="modalTag">동물의 겨울나기</div>
      <h2 class="modal-title" id="modalTitle">동굴 속 곰의 겨울잠</h2>
      <div class="modal-story-box" id="modalStory">이야기 내용</div>
      <div class="modal-actions">
        <button class="btn-modal btn-speak" onclick="speakCurrentStory()">
          <span>🔊</span> <span>목소리로 듣기</span>
        </button>
        <button class="btn-modal btn-close" onclick="closeDetailModal()">
          <span>닫기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Quiz Modal -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal-box">
      <div style="font-size:3rem; margin-bottom:6px;">💡</div>
      <div class="modal-tag">알쏭달쏭 겨울 퀴즈</div>
      <h2 class="modal-title" id="quizQuestion" style="font-size:1.35rem; margin-bottom:12px;">Q1. 문제</h2>
      <div class="quiz-options" id="quizOptions">
        <!-- options -->
      </div>
      <div class="quiz-result" id="quizResultNotice"></div>
      <button class="btn-modal btn-close" onclick="closeQuizModal()" style="margin-top:14px; width:100%;">
        <span>닫기</span>
      </button>
    </div>
  </div>

  <script>
    const ENCY_DATA = [
      // 1. 동물들의 겨울나기 (animal)
      {
        id: 'bear', category: 'animal', emoji: '🐻', title: '동굴 속 곰의 겨울잠',
        tag: '동물의 겨울나기',
        desc: '곰은 가을 동안 열매와 물고기를 듬뿍 먹고, 깊은 겨울 동안 동굴에서 쿨쿨 잠을 자요.',
        story: '곰은 날씨가 몹시 추워지고 먹이가 줄어들면 따뜻하고 아늑한 동굴을 찾아 들어가요. 가을에 미리 통통하게 살을 찌워두었기 때문에 겨울 내내 먹지 않고도 쿨쿨 겨울잠을 잘 수 있답니다.'
      },
      {
        id: 'squirrel', category: 'animal', emoji: '🐿️', title: '다람쥐의 도토리 창고',
        tag: '동물의 겨울나기',
        desc: '가을에 땅속 깊이 숨겨둔 도토리를 찾아 먹으며 겨울을 이겨내요.',
        story: '영리한 다람쥐는 낙엽 밑이나 나무 구멍, 땅속에 가을 동안 모은 도토리를 꽁꽁 숨겨두어요. 겨울에 배가 고플 때마다 냄새를 킁킁 맡아 도토리를 쏙 꺼내 먹는답니다!'
      },
      {
        id: 'rabbit', category: 'animal', emoji: '🐰', title: '눈토끼의 하얀 털 옷',
        tag: '동물의 겨울나기',
        desc: '겨울이 되면 하얀 눈처럼 털이 새하얗게 바뀌어 숲속에 쏙 숨어요.',
        story: '눈토끼는 겨울이 되면 갈색 털을 벗고 새하얀 털로 옷을 갈아입어요. 하얀 눈밭에 있으면 적들의 눈에 잘 띄지 않고, 폭신폭신한 털이 찬바람을 막아준답니다.'
      },
      {
        id: 'duck', category: 'animal', emoji: '🦆', title: '청둥오리의 남쪽 여행',
        tag: '동물의 겨울나기',
        desc: '북쪽의 강이 꽁꽁 얼기 전에 따뜻한 남쪽 나라로 날아와 겨울을 보내요.',
        story: '청둥오리는 찬바람이 불어오면 가족들과 함께 브이(V)자 대형을 지어 머나먼 하늘을 날아가요. 얼지 않은 따뜻한 호수와 물가에 둥지를 틀고 겨울을 건강하게 난답니다.'
      },
      {
        id: 'frog', category: 'animal', emoji: '🐸', title: '개구리의 땅속 겨울잠',
        tag: '동물의 겨울나기',
        desc: '추운 겨울에는 진흙 땅속 깊이 들어가 봄이 올 때까지 쿨쿨 잠을 자요.',
        story: '개구리는 체온이 주변 날씨에 따라 변해요. 그래서 추운 겨울에는 얼지 않는 깊은 진흙 속이나 바위 밑에 웅크리고 들어가 봄이 오기를 기다린답니다.'
      },
      {
        id: 'hedgehog', category: 'animal', emoji: '🦔', title: '고슴도치의 낙엽 침대',
        tag: '동물의 겨울나기',
        desc: '따뜻한 마른 낙엽을 둥글게 모아 침대를 만들고 겨울잠을 자요.',
        story: '고슴도치는 뾰족한 가시를 웅크리고 낙엽과 마른 풀을 모아 만든 둥지 속에서 겨울잠을 자요. 심장도 아주 천천히 뛰며 봄을 기다려요.'
      },

      // 2. 식물들의 겨울나기 (plant)
      {
        id: 'leaf', category: 'plant', emoji: '🍂', title: '나뭇잎 떨구기와 겨울눈',
        tag: '식물의 겨울나기',
        desc: '나무는 물을 아끼기 위해 잎을 떨구고 단단한 겨울눈으로 봄을 준비해요.',
        story: '가을에 알록달록 단풍잎을 모두 떨어뜨린 나무는 겨울 동안 조용히 쉬어요. 나뭇가지 끝에는 솜털로 감싸진 단단한 겨울눈이 있어 추위 속에서도 다음 봄의 새싹을 굳세게 지켜낸답니다.'
      },
      {
        id: 'pine', category: 'plant', emoji: '🌲', title: '늘 푸른 소나무',
        tag: '식물의 겨울나기',
        desc: '바늘 모양의 뾰족한 잎과 두꺼운 껍질로 겨울에도 항상 푸르러요.',
        story: '소나무는 추운 겨울에도 초록빛을 잃지 않아요. 잎이 뾰족하고 표면에 두꺼운 막이 있어 수분을 빼앗기지 않고, 눈이 소복이 쌓여도 멋진 자태를 뽐낸답니다.'
      },
      {
        id: 'camellia', category: 'plant', emoji: '🌺', title: '눈 속에 피는 붉은 동백꽃',
        tag: '식물의 겨울나기',
        desc: '모두가 잠든 하얀 눈 속에서 홀로 붉고 아름다운 꽃망울을 활짝 터뜨려요.',
        story: '동백나무는 추운 겨울에도 두껍고 반짝이는 잎을 가지고 있어요. 눈이 하얗게 내리는 한겨울에 붉은 꽃을 피워 숲속의 작은 새들에게 달콤한 꿀을 선물해 준답니다.'
      },
      {
        id: 'wintergrass', category: 'plant', emoji: '🌾', title: '눈 밑에서 쉬는 겨울 잔디',
        tag: '식물의 겨울나기',
        desc: '갈색으로 변한 잔디는 눈 이불을 덮고 따뜻한 봄을 기다려요.',
        story: '잔디밭이 노랗게 마른 것처럼 보여도 땅속 깊은 곳의 뿌리는 튼튼하게 살아 숨 쉬고 있어요. 하얀 눈이 포근한 이불처럼 땅속 뿌리를 추위로부터 지켜준답니다.'
      },

      // 3. 날씨와 옷차림 (weather)
      {
        id: 'snow', category: 'weather', emoji: '❄️', title: '펄펄 내리는 눈송이',
        tag: '날씨와 옷차림',
        desc: '구름 속 얼음 알갱이가 뭉쳐져 하얀 눈송이가 되어 하늘에서 내려와요.',
        story: '눈송이를 돋보기로 자세히 보면 반짝이는 여섯 갈래 별 모양의 얼음 결정이에요. 하늘에서 펄펄 내리면 세상을 하얗고 눈부시게 물들여 준답니다.'
      },
      {

        options: ['🐻 곰', '🐸 개구리', '🦁 사자'],
        ans: 0
      },
      {
        q: '겨울철 눈길을 걸을 때 안전하게 걷는 방법은 무엇일까요?',
        options: ['손을 주머니에 넣고 뛰기', '🧤 장갑을 끼고 조심조심 걷기', '눈을 감고 달리기'],
        ans: 1
      },
      {
        q: '달콤한 팥이나 슈크림이 들어있는 물고기 모양의 겨울 간식은?',
        options: ['🐟 붕어빵', '🍦 아이스크림', '🍉 수박'],
        ans: 0
      },
      {
        q: '추운 겨울에도 바늘 모양의 초록색 잎을 잃지 않는 늘 푸른 나무는?',
        options: ['🌲 소나무', '🍁 단풍나무', '🌸 벚나무'],
        ans: 0
      }
    ];

    let currentItem = null;
    let currentQuizIndex = 0;

    function renderCards(data) {
      const grid = document.getElementById('encyGrid');
      grid.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ency-card';
        card.onclick = () => openDetailModal(item);
        card.innerHTML = `
          <div class="card-emoji">${item.emoji}</div>
          <div class="card-tag">${item.tag}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-listen-btn"><span>🔊</span> 이야기 듣기</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('#catChips .chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (cat === 'all') {
        renderCards(ENCY_DATA);
      } else {
        renderCards(ENCY_DATA.filter(d => d.category === cat));
      }
    }

    function openDetailModal(item) {
      currentItem = item;
      document.getElementById('modalEmoji').textContent = item.emoji;
      document.getElementById('modalTag').textContent = item.tag;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalStory').textContent = item.story;
      document.getElementById('detailModal').classList.add('open');
      speakCurrentStory();
    }

    function closeDetailModal() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('detailModal').classList.remove('open');
    }

    function speakCurrentStory() {
      if (!currentItem || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(currentItem.title + '. ' + currentItem.story);
        u.lang = 'ko-KR';
        u.rate = 1.0;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      } catch(e) {}
    }

    /* Quiz Logic */
    function openQuizModal() {
      currentQuizIndex = 0;
      loadQuizQuestion(currentQuizIndex);
      document.getElementById('quizModal').classList.add('open');
    }

    function closeQuizModal() {
      document.getElementById('quizModal').classList.remove('open');
    }

    function loadQuizQuestion(idx) {
      const q = QUIZ_LIST[idx];
      document.getElementById('quizQuestion').textContent = `Q${idx + 1}. ${q.q}`;
      const optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      document.getElementById('quizResultNotice').textContent = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.textContent = optText;
        btn.onclick = () => checkQuiz(optIdx, q.ans);
        optContainer.appendChild(btn);
      });
    }

    function checkQuiz(selected, correct) {
      const notice = document.getElementById('quizResultNotice');
      if (selected === correct) {
        notice.style.color = '#16A34A';
        notice.textContent = '🎉 딩동댕! 정답이에요! 최고예요! ⭐';
        if ('speechSynthesis' in window) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance('딩동댕! 정답이에요!'));
        }
        setTimeout(() => {
          currentQuizIndex = (currentQuizIndex + 1) % QUIZ_LIST.length;
          loadQuizQuestion(currentQuizIndex);
        }, 1400);
      } else {
        notice.style.color = '#DC2626';
        notice.textContent = '다시 한 번 생각해 볼까요? 😉';
        if ('speechSynthesis' in window) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance('다시 한 번 생각해 볼까요?'));
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCards(ENCY_DATA);
    });
  </script>
