<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>달누리반 디지털 놀이 아뜰리에 — 7개 놀이앱 통합 플랫폼</title>
  <style>
    /* ==========================================================================
       달누리반 디지털 놀이 아뜰리에 디자인 시스템
       수채화 동화풍의 따뜻하고 세련된 디자인 (아이보리, 크림, 세이지 그린, 파스텔 웜톤)
       ========================================================================== */
    :root {
      --bg-cream: #FAF7F2;
      --bg-card: #FFFFFF;
      --text-main: #332C27;
      --text-sub: #6E655F;
      --primary: #4F8A3A;         /* 세이지 그린 */
      --primary-light: #EBF4E5;
      --primary-dark: #376527;
      --secondary: #E8672A;       /* 따뜻한 테라코타 오렌지 */
      --secondary-light: #FCECE4;
      --accent-yellow: #F6C85F;
      --accent-blue: #4A90E2;
      --border-soft: #EAE4DC;
      --border-hard: #D8CEBE;
      --shadow-soft: 0 4px 16px rgba(79, 58, 42, 0.08);
      --shadow-hover: 0 8px 24px rgba(79, 58, 42, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* 상단 네비게이션 헤더 */
    .app-header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border-soft);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-logo {
      font-size: 28px;
      background: var(--primary-light);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      border: 2px solid #C8E2BA;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }
    .brand-title small {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--primary);
    }

    /* 뷰 모드 전환 버튼 (유아 교실 / 교사 대시보드 / 가정이음) */
    .view-modes-toggle {
      display: flex;
      background: var(--bg-cream);
      padding: 4px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border-soft);
      gap: 4px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #FFFFFF;
      color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1.5px solid #C8E2BA;
    }

    /* 전역 활성 유아 인디케이터 */
    .active-child-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-light);
      border: 1.5px solid #C8E2BA;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary-dark);
    }

    /* 메인 뷰 컨테이너 */
    .main-viewport {
      flex: 1;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 90px; /* 하단 툴바 여백 */
    }

    /* ==========================================================================
       VIEW 1: 유아용 디지털 놀이앱 7종 (태블릿 1~7번 탭)
       ========================================================================== */
    .pad-tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
    }
    .pad-tabs-bar::-webkit-scrollbar { display: none; }
    .pad-tab-chip {
      flex: 0 0 auto;
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      padding: 10px 16px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }
    .pad-tab-chip.active {
      background: #FFFFFF;
      border-color: var(--secondary);
      color: var(--secondary);
      box-shadow: 0 4px 12px rgba(232, 103, 42, 0.15);
      transform: translateY(-2px);
    }
    .pad-num-badge {
      width: 24px;
      height: 24px;
      background: var(--bg-cream);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: inherit;
    }
    .pad-tab-chip.active .pad-num-badge {
      background: var(--secondary);
      color: #FFFFFF;
    }

    .pad-workspace-card {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-soft);
      padding: 24px;
      box-shadow: var(--shadow-soft);
      min-height: 580px;
      display: flex;
      flex-direction: column;
    }

    .pad-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--border-soft);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .pad-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pad-icon-big {
      font-size: 36px;
      background: var(--bg-cream);
      width: 58px;
      height: 58px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border-soft);
    }
    .pad-title-text h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }
    .pad-title-text p {
      font-size: 13.5px;
      color: var(--text-sub);
    }

    /* 앱 공통 인터랙션 요소 (그림판, 사진박스, 문장입력 등) */
    .interactive-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }
    @media (max-width: 900px) {
      .interactive-grid { grid-template-columns: 1fr; }
    }

    .panel-box {
      background: var(--bg-cream);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 캔버스 그리기 영역 */
    .drawing-canvas-wrap {
      background: #FFFFFF;
      border: 2px solid var(--border-hard);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      touch-action: none;
      height: 240px;
    }
    canvas.paint-board {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .canvas-tools {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }
    .color-swatch {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-full);
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 0 1px #999;
      cursor: pointer;
    }
    .color-swatch.active {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px var(--secondary);
    }

    /* 사진 뷰어/촬영 프리뷰 박스 */
    .photo-preview-box {
      background: #FFFFFF;
      border: 2px dashed var(--border-hard);
      border-radius: var(--radius-sm);
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .photo-preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .photo-placeholder {
      text-align: center;
      color: var(--text-sub);
      cursor: pointer;
    }

    /* 말풍선 문장 및 기분 선택 */
    .sentence-input-box {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stt-output-text {
      width: 100%;
      min-height: 70px;
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      resize: vertical;
    }
    .mood-selector {
      display: flex;
      gap: 8px;
    }
    .mood-pill {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid var(--border-soft);
      background: var(--bg-cream);
      border-radius: var(--radius-full);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .mood-pill.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    /* 2번 백과사전 탭 전용 카드 갤러리 */
    .encyclo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .encyclo-card {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .encyclo-card:hover, .encyclo-card.active {
      border-color: var(--secondary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .encyclo-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }
    .encyclo-card-body {
      padding: 10px 12px;
    }
    .encyclo-card-body h4 { font-size: 15px; font-weight: 800; }
    .encyclo-card-body p { font-size: 12.5px; color: var(--text-sub); }

    /* 3번 한글놀이 글자 카드 칩 */
    .korean-tiles-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hangul-tile {
      background: #FFFFFF;
      border: 2px solid #C8E2BA;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }
    .hangul-tile:hover {
      background: var(--primary-light);
      transform: scale(1.05);
    }

    /* 4번 수놀이 인터랙션 블록 */
    .math-counter-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #FFFFFF;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-soft);
    }
    .math-apple-btn {
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .math-apple-btn:active { transform: scale(0.85); }

    /* 5번 편지 템플릿 선택 */
    .letter-paper-selector {
      display: flex;
      gap: 8px;
    }
    .letter-paper-chip {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-soft);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .letter-paper-chip.active {
      border-color: var(--secondary);
      background: var(--secondary-light);
    }

    /* 6번 그림책 제작 뷰어 (책장 넘기기) */
    .book-maker-stage {
      background: #FFFFFF;
      border: 3px solid #D1C7BD;
      border-radius: var(--radius-md);
      padding: 20px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
    }
    .book-page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    /* ==========================================================================
       VIEW 2: 교사용 대시보드 & 성장선(Growth Line)
       ========================================================================== */
    .teacher-dashboard-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .teacher-nav-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border-soft);
      padding-bottom: 8px;
    }
    .teacher-nav-btn {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 10px 18px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }
    .teacher-nav-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* 시간축 SVG 성장선 뷰어 */
    .timeline-card-box {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }
    .svg-scroll-container {
      width: 100%;
      overflow-x: auto;
      padding: 10px 0;
    }
    svg.growth-svg {
      width: 100%;
      min-width: 900px;
      height: 220px;
      display: block;
    }

    /* 좌우 2시점 나란히 비교 카드 그리드 (핵심 기능) */
    .compare-side-by-side {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      margin-top: 16px;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .compare-side-by-side { grid-template-columns: 1fr; }
    }
    .compare-card-col {
      background: var(--bg-cream);
      border: 2px solid var(--border-hard);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .compare-card-col.left { border-top: 6px solid #1B6B93; }
    .compare-card-col.right { border-top: 6px solid #D8352A; }

    .compare-mid-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: var(--secondary);
      font-size: 28px;
      font-weight: 800;
    }

    /* ==========================================================================
       VIEW 3: 가정이음 전용 공간 (학부모 전용 「우리 아이 놀이 이야기」)
       ========================================================================== */
    .family-connect-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .family-banner {
      background: linear-gradient(135deg, #FFF6E9 0%, #F5EFEB 100%);
      border: 2px solid #ECDCCB;
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .family-work-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .family-work-card {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .family-reply-box {
      background: var(--bg-cream);
      border-radius: var(--radius-md);
      padding: 14px;
      border: 1.5px dashed var(--border-hard);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ==========================================================================
       공통 미디어 툴바 (화면 하단 고정 바)
       음성 낭독, 목소리 녹음, 음성인식, 카메라, 그림판, 저장, 가정연계
       ========================================================================== */
    .common-media-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 200;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    }
    .dock-btn {
      height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-full);
      border: 2px solid var(--border-soft);
      background: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dock-btn:hover {
      background: var(--bg-cream);
      border-color: var(--border-hard);
      transform: translateY(-2px);
    }
    .dock-btn.btn-save {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #FFFFFF;
      margin-left: 8px;
    }
    .dock-btn.btn-save:hover {
      background: var(--primary-dark);
    }
    .dock-btn.recording {
      background: #FFE5E5;
      border-color: #E74C3C;
      color: #C0392B;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* 토스트 알림 */
    .toast-popup {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #332C27;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 700;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast-popup.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 유아 선택 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      backdrop-filter: blur(4px);
    }
    .modal-card {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-hover);
    }
    .children-grid-modal {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .child-select-card {
      background: var(--bg-cream);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.2s;
    }
    .child-select-card:hover, .child-select-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       상단 공통 헤더
       ======================================================================== -->
  <header class="app-header">
    <div class="header-brand" onclick="switchView('pad')">
      <div class="brand-logo">🎨</div>
      <div class="brand-title">
        달누리반 디지털 놀이 아뜰리에
        <small>7개 놀이앱 통합 플랫폼</small>
      </div>
    </div>

    <!-- 3대 뷰 모드 전환 (유아 교실 / 교사 대시보드 / 가정이음) -->
    <div class="view-modes-toggle">
      <button type="button" class="mode-btn active" id="btnModePad" onclick="switchView('pad')" data-say="태블릿 놀이 화면으로 이동합니다">
        <span>🧒</span> 유아 놀이실 (7대 패드)
      </button>
      <button type="button" class="mode-btn" id="btnModeTeacher" onclick="switchView('teacher')" data-say="교사 관리실로 이동합니다">

    /* ------------------------------------------------------------------------
       5. 공통 캔버스 그리기 엔진
       ------------------------------------------------------------------------ */
    let canvas, ctx, isDrawing = false;

    function initCanvas() {
      setTimeout(() => {
        canvas = document.getElementById('mainCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;

        canvas.onmousedown = startDraw;
        canvas.onmousemove = drawMove;
        canvas.onmouseup = stopDraw;
        canvas.onmouseleave = stopDraw;

        canvas.ontouchstart = (e) => {
          e.preventDefault();
          const t = e.touches[0];
          const r = canvas.getBoundingClientRect();
          startDraw({ clientX: t.clientX, clientY: t.clientY });
        };
        canvas.ontouchmove = (e) => {
          e.preventDefault();
          const t = e.touches[0];
          drawMove({ clientX: t.clientX, clientY: t.clientY });
        };
        canvas.ontouchend = stopDraw;
      }, 50);
    }

    function startDraw(e) {
      isDrawing = true;
      const r = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
    }

    function drawMove(e) {
      if (!isDrawing) return;
      const r = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
      ctx.stroke();
    }

    function stopDraw() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
        currentDrawingData = canvas.toDataURL('image/png');
      }
    }

    function setDrawColor(color, el) {
      currentColor = color;
      if (ctx) ctx.strokeStyle = color;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function clearCanvas() {
      if (!canvas || !ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentDrawingData = null;
      showToast('그림판이 깨끗해졌어요.');
    }

    /* ------------------------------------------------------------------------
       6. 공통 미디어: 음성 낭독(TTS), 녹음(Audio), 음성인식(STT), 카메라
       ------------------------------------------------------------------------ */
    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentContext() {
      const sent = document.getElementById('workSentenceInput');
      if (sent && sent.value.trim()) {
        speakText(sent.value.trim());
      } else {
        speakText(`${currentPad}번 패드 활동입니다. 화면의 그림과 글자를 소리로 탐색해 보세요.`);
      }
    }

    function toggleVoiceRecord() {
      const btn = document.getElementById('btnRecordVoice');
      const label = document.getElementById('recordLabel');
      const icon = document.getElementById('recordIcon');

      if (!isRecording) {
        // 녹음 시작 시뮬레이션 및 실제 지원 시 MediaRecorder
        isRecording = true;
        btn.classList.add('recording');
        label.textContent = '녹음 중 (터치 시 완료)';
        icon.textContent = '⏹️';
        showToast('내 목소리 녹음을 시작했어요! 이야기해 보세요.');
      } else {
        isRecording = false;
        btn.classList.remove('recording');
        label.textContent = '목소리 녹음 완료';
        icon.textContent = '🎙️';
        showToast('목소리가 작품에 안전하게 담겼어요!');
        speakText('목소리 녹음이 완료되었습니다.');
      }
    }

    function triggerSTT() {
      showToast('말씀하시면 글자로 바꿔드려요!');
      speakText('듣고 있어요. 말씀해 보세요.');
      
      // 음성인식 API 지원 시 연결, 미지원 시 유아 추천 문장 프리셋 자동 완성
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.onresult = (ev) => {
            const transcript = ev.results[0][0].transcript;
            const input = document.getElementById('workSentenceInput');
            if (input) input.value = transcript;
            showToast('말한 내용이 글로 적혔어요!');
          };
          recognition.onerror = () => { fallbackSTT(); };
          recognition.start();
          return;
        } catch(e) {}
      }
      fallbackSTT();
    }

    function fallbackSTT() {
      const samples = [
        "오늘 친구들과 함께 음식을 만들며 정말 신났어요!",
        "향신료 냄새가 신기해서 왜 그런지 계속 궁금해요.",
        "내가 만든 찰흙 둥지에 도토리가 쏙 들어갔어요!"
      ];
      const picked = samples[Math.floor(Math.random() * samples.length)];
      setTimeout(() => {
        const input = document.getElementById('workSentenceInput');
        if (input) input.value = picked;
        showToast('말한 내용이 예쁜 문장으로 적혔어요!');
      }, 1000);
    }

    function triggerCameraCapture() {
      const fileInput = document.getElementById('cameraFileInput');
      if (fileInput) fileInput.click();
    }

    function handlePhotoUpload(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        currentUploadedPhoto = e.target.result;
        const box = document.getElementById('padPhotoBox');
        if (box) {
          box.innerHTML = `<img src="${currentUploadedPhoto}" style="max-height:100%; max-width:100%; object-fit:contain;">`;
        }
        showToast('멋진 놀이 사진이 담겼어요!');
      };
      reader.readAsDataURL(file);
    }

    function saveCurrentWork() {
      const child = getActiveChild();
      const sentenceInput = document.getElementById('workSentenceInput');
      const questionInput = document.getElementById('workQuestionInput');
      const sentence = sentenceInput ? sentenceInput.value.trim() : '신나게 놀이했어요.';
      const question = questionInput ? questionInput.value.trim() : '이 놀이가 참 재미있어요.';

      const padNames = ['', '놀이 일기', '백과사전 탐구', '한글놀이', '수놀이', '마음 편지', '그림책', '생각지도'];
      const padTitle = padNames[currentPad] || '놀이 탐구';

      const newWork = {
        id: 'w_' + Date.now(),
        childId: child.id,
        padId: currentPad,
        date: new Date().toISOString().split('T')[0],
        week: '11월 1주',
        title: `${child.name}의 ${padTitle}`,
        sentence: sentence || '선생님과 친구들과 함께 생각을 펼쳤어요.',
        mood: '😊 즐거워요',
        question: question,
        photo: currentUploadedPhoto || currentDrawingData || 'assets/watercolor_finished_dish.png',
        hasVoice: true,
        sharedWithFamily: true
      };

      worksList.unshift(newWork);
      saveWorksToStorage();

      showToast(`🌟 [${child.name}] 어린이의 작품이 성장 포트폴리오에 저장되었습니다!`);
      speakText('작품이 포트폴리오에 안전하게 저장되었습니다.');
    }

      renderTeacherDashboard();
    }

    function renderTeacherDashboard() {
      const container = document.getElementById('teacherSubContent');
      const child = getActiveChild();
      const childWorks = worksList.filter(w => w.childId === child.id);

      if (currentTeacherSub === 'growth') {
        // 시간축 SVG 성장선 뷰어 및 좌우 비교 화면
        const leftWork = worksList.find(w => w.id === compareLeftId) || childWorks[0];
        const rightWork = worksList.find(w => w.id === compareRightId) || childWorks[childWorks.length - 1];

        container.innerHTML = `
          <div class="timeline-card-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <h3 style="font-size:18px; font-weight:800; color:var(--text-main);">
                  🌱 [${child.name}] 어린이의 시간축 성장선 (Growth Line)
                </h3>
                <p style="font-size:13px; color:var(--text-sub); margin-top:2px;">
                  9월부터 11월까지 주 단위 시간축에서 작품 점을 선택하여 두 시점의 변화를 나란히 비교합니다.
                </p>
              </div>
              <button type="button" class="dock-btn btn-save" onclick="saveCompareWorkRecord()">
                🌟 이 둘을 비교 기록으로 저장
              </button>
            </div>

            <!-- 시간축 SVG 직접 그리기 (차트 라이브러리 일절 배제) -->
            <div class="svg-scroll-container">
              <svg viewBox="0 0 1000 220" class="growth-svg">
                <!-- 가로 기준 시간축 -->
                <line x1="50" y1="110" x2="950" y2="110" stroke="#D1C7BD" stroke-width="2.5" stroke-linecap="round" />
                
                <!-- 주차별 눈금 -->
                ${['9월 1주', '9월 2주', '9월 3주', '9월 4주', '10월 1주', '10월 2주', '10월 3주', '10월 4주', '11월 1주', '11월 2주', '11월 3주'].map((wk, i) => {
                  const x = 80 + i * 85;
                  return `
                    <line x1="${x}" y1="20" x2="${x}" y2="160" stroke="#EAE4DC" stroke-width="1.5" stroke-dasharray="3,3"/>
                    <text x="${x}" y="180" font-size="11.5" font-weight="700" fill="#6E655F" text-anchor="middle">${wk}</text>
                  `;
                }).join('')}

                <!-- 연결 곡선 -->
                <path d="M 165 110 Q 335 80 505 110 T 760 110" fill="none" stroke="#E8672A" stroke-width="3" stroke-linecap="round"/>

                <!-- 작품 점 노드 -->
                ${childWorks.map((w, idx) => {
                  const x = 165 + idx * 190;
                  const isLeft = (w.id === compareLeftId);
                  const isRight = (w.id === compareRightId);
                  const color = isLeft ? '#1B6B93' : (isRight ? '#D8352A' : '#4F8A3A');
                  return `
                    <g cursor="pointer" onclick="selectCompareNode('${w.id}')">
                      ${(isLeft || isRight) ? `<circle cx="${x}" cy="110" r="26" fill="none" stroke="${color}" stroke-width="3" opacity="0.4" />` : ''}
                      <circle cx="${x}" cy="110" r="18" fill="#FFFFFF" stroke="${color}" stroke-width="3" />
                      <text x="${x}" y="115" font-size="12" font-weight="800" fill="#332C27" text-anchor="middle">
                        ${w.appId === 'compare' ? '🌟' : '📖'}
                      </text>
                      <rect x="${x - 40}" y="65" width="80" height="20" rx="10" fill="#FFFFFF" stroke="${color}" stroke-width="1"/>
                      <text x="${x}" y="79" font-size="10" font-weight="700" fill="#332C27" text-anchor="middle">${w.week}</text>
                    </g>
                  `;
                }).join('')}
              </svg>
            </div>

            <!-- 좌우 나란히 비교 화면 (Side-by-Side) -->
            <div class="compare-side-by-side">
              <!-- 왼쪽 시점 (이전) -->
              <div class="compare-card-col left">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:12px; font-weight:800; color:#1B6B93;">시점 1 (이전 기록)</span>
                  <span style="font-size:12px; color:var(--text-sub);">${leftWork ? leftWork.date + ' (' + leftWork.week + ')' : ''}</span>
                </div>
                <h4 style="font-size:16px; font-weight:800;">${leftWork ? leftWork.title : '작품 선택'}</h4>
                <div style="height:150px; background:#fff; border-radius:var(--radius-sm); overflow:hidden; display:flex; align-items:center; justify-content:center;">
                  <img src="${leftWork ? leftWork.photo : ''}" style="max-height:100%; max-width:100%; object-fit:contain;">
                </div>
                <div style="background:#fff; border-radius:var(--radius-sm); padding:10px; border:1px solid var(--border-soft);">
                  <div style="font-size:11px; font-weight:700; color:var(--text-sub);">💬 아이가 말한 문장 원문</div>
                  <p style="font-size:14px; font-weight:700; margin-top:4px;">"${leftWork ? leftWork.sentence : ''}"</p>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:13px;">
                  <span>기분: <b>${leftWork ? leftWork.mood : ''}</b></span>
                  <span>질문: <b>"${leftWork ? leftWork.question : ''}"</b></span>
                </div>
              </div>

              <!-- 브릿지 -->
              <div class="compare-mid-bridge">
                <span>➔</span>
                <span style="font-size:13px; font-weight:800; margin-top:4px;">성장의 증거</span>
              </div>

              <!-- 오른쪽 시점 (최근) -->
              <div class="compare-card-col right">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:12px; font-weight:800; color:#D8352A;">시점 2 (최근 기록)</span>
                  <span style="font-size:12px; color:var(--text-sub);">${rightWork ? rightWork.date + ' (' + rightWork.week + ')' : ''}</span>
                </div>
                <h4 style="font-size:16px; font-weight:800;">${rightWork ? rightWork.title : '작품 선택'}</h4>
                <div style="height:150px; background:#fff; border-radius:var(--radius-sm); overflow:hidden; display:flex; align-items:center; justify-content:center;">
                  <img src="${rightWork ? rightWork.photo : ''}" style="max-height:100%; max-width:100%; object-fit:contain;">
                </div>
                <div style="background:#fff; border-radius:var(--radius-sm); padding:10px; border:1px solid var(--border-soft);">
                  <div style="font-size:11px; font-weight:700; color:var(--text-sub);">💬 아이가 말한 문장 원문</div>
                  <p style="font-size:14px; font-weight:700; margin-top:4px;">"${rightWork ? rightWork.sentence : ''}"</p>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:13px;">
                  <span>기분: <b>${rightWork ? rightWork.mood : ''}</b></span>
                  <span>질문: <b>"${rightWork ? rightWork.question : ''}"</b></span>
                </div>
              </div>
            </div>

            <!-- 교사 관찰 단서 메모 -->
            <div style="margin-top:16px;">
              <label style="font-size:13px; font-weight:700;">📝 교사 관찰 단서 기록 (확인 및 수정 가능)</label>
              <textarea id="teacherCompareNoteInput" class="stt-output-text" style="min-height:50px; margin-top:6px;" placeholder="예: 숲속 나뭇잎 탐구에서 세계 여러 나라의 음식 문화 원인 탐구로 질문이 심화되고 문장이 길어짐."></textarea>
            </div>
          </div>
        `;
      } else if (currentTeacherSub === 'feed') {
        // 전체 작품 목록
        container.innerHTML = `
          <div class="timeline-card-box">
            <h3 style="font-size:18px; font-weight:800; margin-bottom:14px;">달누리반 전체 작품 및 포트폴리오 (${worksList.length}건)</h3>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;">
              ${worksList.map(w => `
                <div style="background:var(--bg-cream); border:2px solid var(--border-soft); border-radius:var(--radius-md); padding:14px; display:flex; flex-direction:column; gap:8px;">
                  <span style="font-size:11.5px; font-weight:700; color:var(--primary);">${w.week} · ${w.date}</span>
                  <h4 style="font-size:15px; font-weight:800;">${w.title}</h4>
                  <img src="${w.photo}" style="height:120px; object-fit:contain; background:#fff; border-radius:var(--radius-sm);" onerror="this.src='assets/consistent_slide_1.png';">
                  <p style="font-size:13px; font-weight:700;">"${w.sentence}"</p>
                  <div style="font-size:12px; color:var(--text-sub);">질문: "${w.question}"</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentTeacherSub === 'familyAdmin') {
        // 가정연계 관리
        container.innerHTML = `
          <div class="timeline-card-box">
            <h3 style="font-size:18px; font-weight:800; margin-bottom:14px;">💌 가정연계 및 학부모 답장 관리</h3>
            <p style="font-size:13.5px; color:var(--text-sub); margin-bottom:16px;">
              학부모님이 남겨주신 소중한 답장과 응원 음성이 실시간으로 동기화됩니다.
            </p>
            <div style="display:flex; flex-direction:column; gap:12px;">
              ${familyReplies.map(r => `
                <div class="family-reply-box" style="background:#fff;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; color:var(--secondary);">💬 ${r.author}</span>
                    <span style="font-size:12px; color:var(--text-sub);">${r.date}</span>
                  </div>
                  <p style="font-size:14px; font-weight:700; color:var(--text-main); margin-top:4px;">"${r.text}"</p>
                  <div style="display:flex; gap:8px; margin-top:6px;">
                    <button type="button" class="dock-btn" style="height:32px; font-size:12px;" onclick="speakText('${r.text.replace(/'/g, "\\'")}')">🔊 목소리 듣기</button>
                    <button type="button" class="dock-btn" style="height:32px; font-size:12px; color:#c0392b;" onclick="deleteReply('${r.id}')">삭제</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function selectCompareNode(workId) {
      if (compareLeftId === workId) {
        // 토글
      } else if (compareRightId === workId) {
        compareRightId = null;
      } else if (!compareLeftId) {
        compareLeftId = workId;
      } else {
        compareRightId = workId;
      }
      renderTeacherDashboard();
    }

    function saveCompareWorkRecord() {
      const child = getActiveChild();
      const leftWork = worksList.find(w => w.id === compareLeftId);
      const rightWork = worksList.find(w => w.id === compareRightId);
      if (!leftWork || !rightWork) {
        alert('비교할 두 작품을 먼저 선택해 주세요.');
        return;
      }

      const noteInput = document.getElementById('teacherCompareNoteInput');
      const note = noteInput ? noteInput.value.trim() : '놀이 탐구와 문장 표현의 성장 변화';

      const compareWork = {
        id: 'w_comp_' + Date.now(),
        childId: child.id,
        appId: 'compare',
        padId: 1,
        date: new Date().toISOString().split('T')[0],
        week: rightWork.week,
        title: `${leftWork.week} vs ${rightWork.week} 성장 비교`,
        sentence: `[이전] "${leftWork.sentence}" ➔ [현재] "${rightWork.sentence}"`,
        mood: rightWork.mood,
        question: `질문 발전: "${leftWork.question}" ➔ "${rightWork.question}"`,
        photo: rightWork.photo,
        payload: {
          leftId: leftWork.id,
          rightId: rightWork.id,
          note: note
        },
        hasVoice: true,
        sharedWithFamily: true
      };

      worksList.unshift(compareWork);
      saveWorksToStorage();
      showToast('🌟 성장 비교 카드가 작품으로 저장되었습니다!');
      speakText('성장 비교 카드가 포트폴리오에 저장되었습니다.');
      renderTeacherDashboard();
    }

    /* ------------------------------------------------------------------------
       9. VIEW 3: 가정이음 전용 공간 (학부모)
       ------------------------------------------------------------------------ */
    function renderFamilyFeed() {
      const container = document.getElementById('familyWorkFeed');
      const child = getActiveChild();
      const childWorks = worksList.filter(w => w.childId === child.id && w.sharedWithFamily);

      container.innerHTML = `
        ${childWorks.map(w => `
          <div class="family-work-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="tip-pill">${w.week}의 놀이 기록</span>
              <span style="font-size:12px; color:var(--text-sub);">${w.date}</span>
            </div>
            <h3 style="font-size:18px; font-weight:800; color:var(--text-main);">${w.title}</h3>
            <div style="max-height:260px; background:var(--bg-cream); border-radius:var(--radius-md); overflow:hidden; display:flex; align-items:center; justify-content:center;">
              <img src="${w.photo}" style="max-height:260px; max-width:100%; object-fit:contain;">
            </div>
            <div style="background:var(--primary-light); border-radius:var(--radius-md); padding:12px 16px; border:1px solid #C8E2BA;">
              <div style="font-size:11.5px; font-weight:700; color:var(--primary-dark);">💬 우리 아이가 들려준 이야기</div>
              <p style="font-size:15px; font-weight:800; margin-top:4px;">"${w.sentence}"</p>
              <button type="button" class="dock-btn" style="height:32px; margin-top:8px; font-size:12px;" onclick="speakText('${w.sentence.replace(/'/g, "\\'")}')">
                <span>🔊</span> 아이 목소리로 듣기
              </button>
            </div>
            <div style="font-size:13px; color:var(--text-sub);">
              호기심 질문: <b>"${w.question}"</b>
            </div>
          </div>
        `).join('')}
      `;
    }

    function openFamilyReplyPrompt() {
      const reply = prompt('아이에게 보낼 따뜻한 응원의 한마디를 적어주세요:');
      if (reply && reply.trim()) {
        const child = getActiveChild();
        const newReply = {
          id: 'rep_' + Date.now(),
          childId: child.id,
          workId: 'latest',
          author: `${child.name} 가족`,
          date: new Date().toISOString().split('T')[0],
          text: reply.trim(),
          voice: true,
          heardByChild: false
        };
        familyReplies.unshift(newReply);
        saveRepliesToStorage();
        showToast('가정의 따뜻한 답장이 교실로 전달되었습니다!');
        speakText('가정의 답장이 교실에 도착했습니다.');
        renderFamilyFeed();
      }
    }

    function deleteReply(id) {
      familyReplies = familyReplies.filter(r => r.id !== id);
      saveRepliesToStorage();
      renderTeacherDashboard();
    }

    /* ------------------------------------------------------------------------
       10. 유아 선택 모달 제어
       ------------------------------------------------------------------------ */
    function openChildSelectModal() {
      const modal = document.getElementById('childSelectModal');
      const list = document.getElementById('modalChildrenList');
      modal.style.display = 'flex';

      list.innerHTML = CHILDREN.map(c => `
        <div class="child-select-card ${c.id === activeChildId ? 'active' : ''}" onclick="selectChild('${c.id}')">
          <div style="font-size:28px;">${c.avatar}</div>
          <div style="margin-top:4px;">${c.name}</div>
        </div>
      `).join('');
    }

    function closeChildSelectModal() {
      document.getElementById('childSelectModal').style.display = 'none';
    }

    function selectChild(childId) {
      activeChildId = childId;
      closeChildSelectModal();
      updateHeaderChildUI();
      if (currentView === 'pad') renderCurrentPad();
      if (currentView === 'teacher') renderTeacherDashboard();
      if (currentView === 'family') renderFamilyFeed();
      showToast(`[${getActiveChild().name}] 어린이로 전환되었습니다.`);
      speakText(`${getActiveChild().name} 어린이 화면입니다.`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastPopup');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    /* ------------------------------------------------------------------------
       초기 실행
       ------------------------------------------------------------------------ */
    window.addEventListener('DOMContentLoaded', () => {
      // URL 파라미터 파싱 (?pad=1~7, ?mode=teacher/family)
      const params = new URLSearchParams(window.location.search);
      const padParam = parseInt(params.get('pad'), 10);
      const modeParam = params.get('mode');

      if (padParam >= 1 && padParam <= 7) {
        currentPad = padParam;
      }
      if (modeParam) {
        switchView(modeParam);
      } else {
        switchView('pad');
      }
      updateHeaderChildUI();
    });
  </script>
</body>
</html>
