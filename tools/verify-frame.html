<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>검증 프레임</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}
#f{position:absolute;left:0;border:0;display:block;background:#fff}</style>
</head><body>
<script>
var p = new URLSearchParams(location.search);
var w = +(p.get("w")||1440), h = +(p.get("h")||900), oy = +(p.get("oy")||0), y = +(p.get("y")||0);
var f = document.createElement("iframe");
f.id = "f"; f.width = w; f.height = h;
f.style.width = w+"px"; f.style.height = h+"px"; f.style.top = (-oy)+"px";
f.onload = function(){
  setTimeout(function(){ try { f.contentWindow.scrollTo(0, y); } catch(e){} }, 300);
};
f.src = "./dalnuri-heart-books.html" + (p.get("hash") ? p.get("hash") : "");
document.body.appendChild(f);
</script>
</body></html>
